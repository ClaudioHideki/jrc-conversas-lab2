name: Precimech hotfix regression
on:
  push:
    branches: [codex/hotfix-precimech-whatsapp-retry-20261111]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to test
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read

env:
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '11111111111111111111111111111111'
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '22222222222222222222222222222222'
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '33333333333333333333333333333333'

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: precimech_hotfix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d precimech_hotfix_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://host.example.test
      SECRET_KEY_BASE: synthetic_test_only_not_production
      POSTGRES_HOST: localhost
      POSTGRES_DATABASE: precimech_hotfix_test
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: synthetic_test_only
      REDIS_URL: redis://localhost:6379/0
      BUNDLE_FROZEN: 'true'
      BUNDLE_WITHOUT: development
      LOG_LEVEL: error
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm baseline ancestry and source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor 4ce8241d35ce862e9d53e9a5dce4df9a1858432c "$SOURCE_SHA"
      - name: Verify runner PostgreSQL build headers
        run: pg_config --version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - name: Prepare disposable test schema
        run: |
          bundle exec rails db:create db:schema:load
          SCHEMA="$RUNNER_TEMP/precimech-test-schema.rb" bundle exec rails db:migrate
      - name: Request regression and preserved WhatsApp paths
        run: >-
          bundle exec rspec
          spec/controllers/api/v1/accounts/conversations/whatsapp_retry_spec.rb
          spec/controllers/api/v1/accounts/conversations/whatsapp_eligible_retry_spec.rb
          spec/controllers/api/v1/accounts/conversations/whatsapp_batch_spec.rb
          spec/controllers/api/v1/accounts/conversations/messages_controller_spec.rb
          spec/services/whatsapp/send_on_whatsapp_service_spec.rb
          spec/services/whatsapp/providers/whatsapp_cloud_service_spec.rb
          spec/services/whatsapp/oneoff_campaign_service_spec.rb
          spec/services/whatsapp/incoming_message_whatsapp_cloud_service_spec.rb
          spec/jobs/send_reply_job_spec.rb
          --format progress --format json --out /tmp/whatsapp-native.json
      - name: Require positive zero-error native report
        run: >-
          ruby -rjson -e 'ARGV.each { |path| s=JSON.parse(File.read(path)).fetch("summary"); abort "Empty, failed or pending native gate: #{path}" unless s.fetch("example_count").positive? && s.fetch("failure_count").zero? && s.fetch("pending_count").zero? && s.fetch("errors_outside_of_examples_count").zero? }' /tmp/whatsapp-native.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: whatsapp-native-${{ github.sha }}
          path: /tmp/whatsapp-native.json
          if-no-files-found: error
      - name: Ensure source remains clean
        run: git diff --exit-code
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Retry store and component regressions
        run: >-
          pnpm exec vitest run
          app/javascript/dashboard/store/modules/specs/conversations/actions.spec.js
          app/javascript/dashboard/store/modules/specs/conversations/whatsappRetry.spec.js
          app/javascript/dashboard/components-next/message/specs/MessageError.spec.js
          --maxWorkers=2 --no-file-parallelism
          --reporter=default --reporter=json --outputFile=/tmp/whatsapp-ui-results.json
      - name: Lint dos arquivos frontend do retry
        run: >-
          pnpm exec eslint
          app/javascript/dashboard/components-next/message/Message.vue
          app/javascript/dashboard/components-next/message/MessageError.vue
          app/javascript/dashboard/store/modules/conversations/actions.js
          app/javascript/dashboard/components-next/message/specs/MessageError.spec.js
          app/javascript/dashboard/store/modules/specs/conversations/whatsappRetry.spec.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: whatsapp-ui-${{ github.sha }}
          path: /tmp/whatsapp-ui-results.json
          if-no-files-found: error
