name: Isolated release evidence gate (no image or publication)

on:
  workflow_dispatch:
    inputs:
      expected_infrastructure_sha:
        description: Full SHA of the authorized release infrastructure
        type: string
        required: true
      expected_product_sha:
        description: Approved immutable product SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-evidence-cad427d4
  cancel-in-progress: false

jobs:
  evidence-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_INFRASTRUCTURE_SHA: ${{ inputs.expected_infrastructure_sha }}
      EXPECTED_PRODUCT_SHA: ${{ inputs.expected_product_sha }}
    steps:
      - name: Checkout immutable infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify dispatch identity before any verification
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_INFRASTRUCTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$EXPECTED_PRODUCT_SHA" = cad427d400d824fc1fdc06c1c1079f324e7f3f6c
          test "$GITHUB_REF_NAME" = ci/release-gate-cad427d4-20261112
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Validate workflow with checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release-actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --location --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/release-linter"
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-linter" actionlint
          "$RUNNER_TEMP/release-linter/actionlint" .github/workflows/ag-native-candidate.yml
      - name: Syntax and denial tests of the release gate
        env:
          GATE_TEST_REPORT: ${{ runner.temp }}/gate-tests.json
        run: |
          python3 -B -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.github/release').glob('*.py')]"
          python3 -B .github/release/test_gate.py
      - name: Checkout approved product without infrastructure overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cad427d400d824fc1fdc06c1c1079f324e7f3f6c
          path: product
          persist-credentials: false
          fetch-depth: 0
      - name: Configure declared Node for original migration protection tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: product/.nvmrc
      - name: Preserve original migration identity and history protections
        working-directory: product
        run: |
          node script/validate_ag_migration_identity.mjs
          node --test script/validate_migration_timestamps.test.mjs script/validate_ag_historical_migrations.test.mjs
      - name: Verify exact native run and all immutable evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B .github/release/gate.py \
            --lock .github/release/release-evidence-lock.json \
            --infrastructure-sha "$EXPECTED_INFRASTRUCTURE_SHA" \
            --product product --output "$RUNNER_TEMP/release-gate-report.json"
      - name: Preserve gate results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-gate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gate-tests.json
            ${{ runner.temp }}/release-gate-report.json
          if-no-files-found: error
          retention-days: 7
