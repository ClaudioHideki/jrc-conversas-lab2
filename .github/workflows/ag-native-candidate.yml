name: Vite heap configuration only
on:
  workflow_dispatch:
    inputs:
      expected_product_sha:
        required: true
        type: string
      expected_infrastructure_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vite-heap-config-${{ github.ref }}
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PRODUCT_SHA: ${{ inputs.expected_product_sha }}
      EXPECTED_INFRASTRUCTURE_SHA: ${{ inputs.expected_infrastructure_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_infrastructure_sha }}
          path: infrastructure
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '5640793988fbf63ac46b0db3466722fc650f0d01'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable identities and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PRODUCT_SHA" = 5640793988fbf63ac46b0db3466722fc650f0d01
          test "$GITHUB_SHA" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$(git -C infrastructure rev-parse HEAD)" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          mkdir -p "$RUNNER_TEMP/heap-validation"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: none
          bundler-cache: false
      - name: Static syntax and actionlint
        shell: bash
        run: |
          set -euo pipefail
          node --check product/script/jrc_vite_build.mjs
          node --check product/script/jrc_vite_build.test.mjs
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in ['product/script/jrc_runtime_contract_test.py',
                    'infrastructure/.github/heap_validation/verify.py']:
              ast.parse(Path(p).read_text())
          PY
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' infrastructure/.github/workflows/ag-native-candidate.yml \
            | tee "$RUNNER_TEMP/heap-validation/actionlint.log"
      - name: Vite scope, limits and owned-process tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/heap-validation/vite-tests.xml" \
            product/script/jrc_vite_build.test.mjs | tee "$RUNNER_TEMP/heap-validation/vite-tests.tap"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP'])/'heap-validation/vite-tests.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 13, len(cases)
          assert not list(root.iter('failure')) and not list(root.iter('error')) and not list(root.iter('skipped'))
          PY
      - name: Preserved runtime and migration contracts
        shell: bash
        run: |
          set -euo pipefail
          python product/script/jrc_runtime_contract_test.py "$RUNNER_TEMP/heap-validation/runtime-contract.json"
          (cd product/script && python -m unittest -v jrc_runtime_contract_test_test) \
            2>&1 | tee "$RUNNER_TEMP/heap-validation/runtime-lock-tests.log"
          (cd product && node --test script/validate_ag_historical_migrations.test.mjs \
            script/validate_ag_migration_identity.test.mjs script/validate_migration_timestamps.test.mjs) \
            | tee "$RUNNER_TEMP/heap-validation/migration-guards.tap"
          (cd product && node script/validate_ag_migration_identity.mjs) \
            | tee "$RUNNER_TEMP/heap-validation/migration-identity.log"
      - name: Official Vite Ruby routing and Alpine process-memory probes
        shell: bash
        run: |
          set -euo pipefail
          python infrastructure/.github/heap_validation/verify.py \
            | tee "$RUNNER_TEMP/heap-validation/configuration.log"
      - name: Hash configuration evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'heap-validation'
          out.mkdir(exist_ok=True)
          files=[{'path':str(p.relative_to(out)), 'bytes':p.stat().st_size,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                 for p in sorted(out.rglob('*')) if p.is_file()]
          (out/'manifest.json').write_text(json.dumps({
            'product_sha':os.environ['EXPECTED_PRODUCT_SHA'],
            'infrastructure_sha':os.environ['EXPECTED_INFRASTRUCTURE_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'], 'files':files,
            'application_image_build_executed':False,
            'real_vite_compilation_executed':False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vite-heap-configuration
          path: ${{ runner.temp }}/heap-validation/
          retention-days: 7
          if-no-files-found: error
