name: Scoped native quick replies and approval catalog tests
on:
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        type: string
        required: true
      expected_product_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: quick-replies-approval-tests-${{ github.ref }}
  cancel-in-progress: false
env:
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '11111111111111111111111111111111'
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '22222222222222222222222222222222'
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '33333333333333333333333333333333'
  EXPECTED_PRODUCT_SHA: ${{ inputs.expected_product_sha }}
  EXPECTED_EXECUTION_SHA: ${{ inputs.expected_execution_sha }}
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 93c64a6bc69851ce88598910ec05787ec54499a6
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source and separate infrastructure identity
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_EXECUTION_SHA"
          test "$EXPECTED_PRODUCT_SHA" = 93c64a6bc69851ce88598910ec05787ec54499a6
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git diff --name-only "$EXPECTED_PRODUCT_SHA" "$GITHUB_SHA")" = .github/workflows/ag-native-candidate.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate the exact isolated workflow with checksum-pinned actionlint
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --location --fail --silent --show-error --connect-timeout 10 --max-time 60 -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 /tmp/actionlint.tar.gz | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          git show "$GITHUB_SHA":.github/workflows/ag-native-candidate.yml > /tmp/ag-native-candidate.yml
          /tmp/actionlint /tmp/ag-native-candidate.yml
      - name: Lint only the affected native UI paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only 55da80eb1254aee54ee0f1fb5c42f2be46a98737 HEAD -- app/javascript | grep -E '\.(vue|js)$')
          pnpm exec eslint "${files[@]}"
      - name: Existing editor, uploads, inbox and approval regressions plus new workflow cases
        run: |
          pnpm exec vitest run app/javascript/dashboard/routes/dashboard/approvals \
            app/javascript/dashboard/routes/dashboard/inbox \
            app/javascript/dashboard/components/widgets/conversation/specs \
            app/javascript/dashboard/helper/specs/editorHelper.spec.js \
            app/javascript/dashboard/store/modules/specs/cannedResponses \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/quick-vue.json
          node -e 'const r=require("/tmp/quick-vue.json");if(!r.success||!r.numTotalTests||r.numFailedTests||r.numPendingTests)process.exit(1)'
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quick-approval-vue-${{ inputs.expected_product_sha }}
          path: /tmp/quick-vue.json
          if-no-files-found: warn
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://host.example.test
      POSTGRES_HOST: jrc-rel-v2-pg-20261101
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_rel_v2_candidate_test
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: synthetic-scoped-ci-not-production
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/quick-approval-schema.rb
      JRC_SD_CONCURRENCY: '1'
      JRC_REVIEWED_CONCURRENCY: '1'
      JRC_BO_TEST_SOCKET_DIRECTORY: /run/jrc-ag-ci-av
      DB_POOL_SIZE: '10'
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 93c64a6bc69851ce88598910ec05787ec54499a6
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable identity and exclusively owned disposable services
        env:
          JRC_AG_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_EXECUTION_SHA"
          test "$EXPECTED_PRODUCT_SHA" = 93c64a6bc69851ce88598910ec05787ec54499a6
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{json .HostConfig.Binds}}')" = null
          echo "JRC_AG_POSTGRES_SERVICE_ID=$JRC_AG_POSTGRES_SERVICE_ID" >> "$GITHUB_ENV"
          echo '127.0.0.1 jrc-rel-v2-pg-20261101' | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /run/jrc-ag-ci-av
          bash .github/scripts/jrc_ci_apt_setup.sh libpq-dev libvips-dev imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Preserve migration identity and native lint
        run: |
          set -euo pipefail
          node script/validate_ag_migration_identity.mjs
          node --test script/validate_migration_timestamps.test.mjs script/validate_ag_historical_migrations.test.mjs
          mapfile -t files < <(git diff --name-only 55da80eb1254aee54ee0f1fb5c42f2be46a98737 HEAD -- '*.rb')
          bundle exec rubocop --force-exclusion --only Lint --format simple "${files[@]}"
      - name: Migrate only the disposable synthetic database
        run: bundle exec rails db:create db:migrate
      - name: Native approval and quick-reply security, persistence and integration tests
        run: |
          bundle exec rspec spec/requests/api/v1/accounts/jrc_approvals \
            spec/services/jrc_approvals \
            spec/controllers/api/v1/accounts/canned_responses_controller_spec.rb \
            spec/requests/api/v1/accounts/canned_replies_workflow_spec.rb \
            --seed 20261115 --require ./script/jrc_ag_ci_formatter.rb --format JrcAgCiFormatter --format json --out /tmp/quick-rspec.json
          ruby -rjson -e 'r=JSON.parse(File.read(ARGV.fetch(0))).fetch("summary");abort "Empty, failed or pending native examples" unless r.fetch("example_count").positive? && r.fetch("failure_count").zero? && r.fetch("pending_count").zero? && r.fetch("errors_outside_of_examples_count").zero?' /tmp/quick-rspec.json
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quick-approval-native-${{ inputs.expected_product_sha }}
          path: /tmp/quick-rspec.json
          if-no-files-found: warn
