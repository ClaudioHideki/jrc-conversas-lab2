name: A-G consolidated native candidate (no publication)

on:
  push:
    branches: [codex/lab2-ag-consolidada-20261110]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ag-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: git merge-base --is-ancestor d8a83b824b11cc68ddbbce7c79681f368051fb70 HEAD
      - run: node --test script/validate_ag_migration_identity.test.mjs
      - run: python3 script/jrc_ag_native_plan_test.py
      - run: python3 script/jrc_ag_catalog_compare_test.py
      # Known identity collisions must be resolved with a tested history-adoption plan.
      # Never mark the current combined tree as database-ready while this gate fails.
      - run: node script/validate_ag_migration_identity.mjs

  migration-admission:
    needs: identities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://host.example.test
      POSTGRES_HOST: jrc-rel-v2-pg-20261101
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_rel_v2_candidate_test
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: synthetic-ag-ci-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/ag-fresh-schema.rb
      JRC_AG_FIXTURE_RECEIPT: /tmp/ag-fixture-receipt.json
      JRC_SD_CONCURRENCY: '1'
      JRC_BO_TEST_SOCKET_DIRECTORY: /run/jrc-ag-ci-av
      JRC_REVIEWED_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove disposable service; legacy spec alias exists only on this ephemeral runner
        shell: bash
        env:
          JRC_AG_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{.Id}} {{.Config.Image}}'
          test "$(docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{json .HostConfig.Binds}}')" = null
          echo "JRC_AG_POSTGRES_SERVICE_ID=$JRC_AG_POSTGRES_SERVICE_ID" >> "$GITHUB_ENV"
          echo '127.0.0.1 jrc-rel-v2-pg-20261101' | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /run/jrc-ag-ci-av
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libvips-dev imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: 2.5.16
          bundler-cache: true
      - name: Prove fresh, pinned-main upgrade and real schema reload on three new databases
        shell: bash
        run: |
          bundle exec rails db:create db:migrate
          bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          bundle exec rails db:schema:dump
          JRC_AG_CATALOG_OUTPUT=/tmp/ag-fresh-catalog.json bundle exec rails runner script/jrc_ag_ci_fixture.rb catalog
          POSTGRES_DATABASE=jrc_jornada_candidate_test bundle exec rails db:create
          POSTGRES_DATABASE=jrc_jornada_candidate_test bundle exec rails runner script/jrc_ag_ci_fixture.rb load_main
          POSTGRES_DATABASE=jrc_jornada_candidate_test SCHEMA=/tmp/ag-upgrade-schema.rb bundle exec rails db:migrate
          POSTGRES_DATABASE=jrc_jornada_candidate_test bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          POSTGRES_DATABASE=jrc_jornada_candidate_test bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          POSTGRES_DATABASE=jrc_jornada_candidate_test JRC_AG_CATALOG_OUTPUT=/tmp/ag-upgrade-catalog.json bundle exec rails runner script/jrc_ag_ci_fixture.rb catalog
          POSTGRES_DATABASE=jrc_four_domains_schema_test bundle exec rails db:create db:schema:load
          POSTGRES_DATABASE=jrc_four_domains_schema_test bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          POSTGRES_DATABASE=jrc_four_domains_schema_test JRC_AG_FIXTURE_RECEIPT=/tmp/ag-reload-receipt.json bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          POSTGRES_DATABASE=jrc_four_domains_schema_test JRC_AG_CATALOG_OUTPUT=/tmp/ag-reload-catalog.json bundle exec rails runner script/jrc_ag_ci_fixture.rb catalog
          python3 script/jrc_ag_catalog_compare.py /tmp/ag-fresh-catalog.json /tmp/ag-upgrade-catalog.json /tmp/ag-reload-catalog.json
      - name: Preserve actual synthetic catalogs and generated schema, including failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag-migration-admission-${{ github.sha }}
          path: |
            /tmp/ag-fresh-schema.rb
            /tmp/ag-upgrade-schema.rb
            /tmp/ag-*-catalog*.json
            /tmp/ag-fixture-receipt.json
          if-no-files-found: warn

  native-focused:
    needs: [identities, migration-admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://host.example.test
      POSTGRES_HOST: jrc-rel-v2-pg-20261101
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_rel_v2_candidate_test
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: synthetic-ag-ci-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/ag-focused-schema.rb
      JRC_AG_FIXTURE_RECEIPT: /tmp/ag-fixture-receipt.json
      JRC_SD_CONCURRENCY: '1'
      JRC_BO_TEST_SOCKET_DIRECTORY: /run/jrc-ag-ci-av
      JRC_REVIEWED_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove disposable service; legacy spec alias exists only on this ephemeral runner
        shell: bash
        env:
          JRC_AG_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{.Id}} {{.Config.Image}}'
          test "$(docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{json .HostConfig.Binds}}')" = null
          echo "JRC_AG_POSTGRES_SERVICE_ID=$JRC_AG_POSTGRES_SERVICE_ID" >> "$GITHUB_ENV"
          echo '127.0.0.1 jrc-rel-v2-pg-20261101' | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /run/jrc-ag-ci-av
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libvips-dev imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: 2.5.16
          bundler-cache: true
      - name: Admit only an empty disposable native database
        run: |
          bundle exec rails db:create db:migrate
          bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
      - name: Reproduce corrected native failures before the full regression matrix
        shell: bash
        run: |
          bundle exec rspec \
            spec/services/jrc_relationship/approved_local_roles_spec.rb \
            spec/jobs/jrc_backoffice/document_preanalysis_job_spec.rb \
            spec/requests/api/v1/accounts/relationship/configuration_restore_spec.rb \
            spec/requests/api/v1/accounts/relationship/portfolio_group_governance_spec.rb \
            spec/requests/api/v1/accounts/jrc_approvals/adjustments_spec.rb \
            spec/services/jrc_backoffice/document_safety_spec.rb \
            spec/requests/api/v1/accounts/crm/approved_human_requirements_spec.rb \
            spec/requests/api/v1/accounts/jrc_approvals/approved_financial_adjustments_spec.rb \
            spec/services/jrc_customers/company_import_corporate_scope_spec.rb \
            spec/services/jrc_backoffice/consolidated_migration_identity_spec.rb \
            spec/services/jrc_crm/nexora_end_to_end_spec.rb \
            spec/services/jrc_relationship/playbook_flow_spec.rb \
            spec/services/jrc_relationship/survey_message_execution_provider_boundary_spec.rb \
            spec/services/jrc_relationship/operations_spec.rb \
            spec/requests/api/v1/accounts/relationship/survey_reports_spec.rb \
            spec/services/jrc_relationship/customer_documents_latest_versions_spec.rb \
            spec/requests/api/v1/accounts/relationship/document_catalog_scale_spec.rb \
            spec/services/jrc_backoffice/signatures/admissions_spec.rb \
            spec/requests/api/v1/accounts/relationship/analyst_restoration_spec.rb \
            spec/requests/api/v1/accounts/jrc_approvals/commercial_api_spec.rb \
            spec/requests/api/v1/accounts/relationship/customer_documents_spec.rb \
            --seed 20261110 --require ./script/jrc_ag_ci_formatter.rb --format JrcAgCiFormatter --format json --out /tmp/ag-focused-rspec.json
          ruby -rjson -e 'r=JSON.parse(File.read(ARGV.fetch(0))).fetch("summary"); abort "Empty, failed or pending native examples" unless r.fetch("example_count").positive? && r.fetch("failure_count").zero? && r.fetch("pending_count").zero?' /tmp/ag-focused-rspec.json
      - name: Preserve focused native failures and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag-native-focused-${{ github.sha }}
          path: /tmp/ag-focused-rspec.json
          if-no-files-found: warn

  rails:
    needs: [identities, migration-admission, native-focused]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        installation: [fresh, upgrade]
        target:
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 1, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 2, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 3, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 4, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 5, count: 6, exclusive: ''}
          - {database: jrc_four_domains_schema_admission_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_rel_sd_candidate_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_jornada_candidate_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_four_domains_schema_authority_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_four_domains_schema_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_ag_retention_native_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: signing_identity}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: document_scan}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: contract_version}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: signature_integration}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: signature_connection}
          - {database: jrc_jornada_candidate_test, shard: 0, count: 1, exclusive: reviewed_operations}
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://host.example.test
      POSTGRES_HOST: jrc-rel-v2-pg-20261101
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: ${{ matrix.target.database }}
      JRC_AG_EXCLUSIVE_SPEC: ${{ matrix.target.exclusive }}
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: synthetic-ag-ci-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/ag-schema.rb
      JRC_AG_FIXTURE_RECEIPT: /tmp/ag-fixture-receipt.json
      JRC_SD_CONCURRENCY: '1'
      JRC_BO_TEST_SOCKET_DIRECTORY: /run/jrc-ag-ci-av
      JRC_REVIEWED_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove disposable service; legacy spec alias exists only on this ephemeral runner
        shell: bash
        env:
          JRC_AG_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{.Id}} {{.Config.Image}}'
          test "$(docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{json .HostConfig.Binds}}')" = null
          echo "JRC_AG_POSTGRES_SERVICE_ID=$JRC_AG_POSTGRES_SERVICE_ID" >> "$GITHUB_ENV"
          echo '127.0.0.1 jrc-rel-v2-pg-20261101' | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /run/jrc-ag-ci-av
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libvips-dev imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: 2.5.16
          bundler-cache: true
      - name: Plan every native example source, respecting existing database guards
        run: python3 script/jrc_ag_native_plan.py > /tmp/ag-test-plan.json
      - name: Create exclusive empty test database
        run: bundle exec rails db:create
      - name: Reproduce pinned main and its actual migration ledger
        if: matrix.installation == 'upgrade'
        run: bundle exec rails runner script/jrc_ag_ci_fixture.rb load_main
      - name: Native migrations and idempotent reexecution
        run: |
          bundle exec rails db:migrate
          bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          bundle exec rails db:migrate
          bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          bundle exec rails zeitwerk:check
      - name: Focused cumulative and integration regressions before the broad suite
        if: matrix.target.database == 'jrc_rel_v2_candidate_test' && matrix.target.shard == 0 && matrix.target.exclusive == ''
        run: |
          bundle exec rspec spec/services/jrc_relationship/approved_local_roles_spec.rb \
            spec/requests/api/v1/accounts/crm/approved_human_requirements_spec.rb \
            spec/requests/api/v1/accounts/jrc_approvals/approved_financial_adjustments_spec.rb \
            spec/services/jrc_customers/company_import_corporate_scope_spec.rb \
            spec/services/jrc_backoffice/consolidated_migration_identity_spec.rb \
            --seed 20261110 --require ./script/jrc_ag_ci_formatter.rb --format JrcAgCiFormatter --format json --out /tmp/ag-focused-rspec.json
          ruby -rjson -e 'r=JSON.parse(File.read(ARGV.fetch(0))).fetch("summary"); abort "Empty, failed or pending native examples" unless r.fetch("example_count").positive? && r.fetch("failure_count").zero? && r.fetch("pending_count").zero?' /tmp/ag-focused-rspec.json
      - name: Authenticated APIs, policies, immutable history, signatures and real transactions
        shell: bash
        run: |
          mapfile -t specs < <(python3 script/jrc_ag_native_plan.py --database "$POSTGRES_DATABASE" --paths --shard-index "${{ matrix.target.shard }}" --shard-count "${{ matrix.target.count }}" --exclusive "${{ matrix.target.exclusive }}")
          test "${#specs[@]}" -gt 0
          bundle exec rspec "${specs[@]}" --seed 20261110 --require ./script/jrc_ag_ci_formatter.rb --format JrcAgCiFormatter --format json --out /tmp/ag-rspec.json
          ruby -rjson -e 'r=JSON.parse(File.read(ARGV.fetch(0))).fetch("summary"); abort "Empty, failed or pending native examples" unless r.fetch("example_count").positive? && r.fetch("failure_count").zero? && r.fetch("pending_count").zero?' /tmp/ag-rspec.json
      - name: Preserve synthetic evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag-native-${{ github.sha }}-${{ matrix.installation }}-${{ matrix.target.database }}-${{ matrix.target.shard }}-${{ matrix.target.exclusive }}
          path: |
            /tmp/ag-test-plan.json
            /tmp/ag-rspec.json
            /tmp/ag-focused-rspec.json
            /tmp/ag-schema.rb
            /tmp/ag-fixture-receipt.json
          if-no-files-found: warn
      - name: Source remains unchanged
        run: git diff --exit-code

  frontend:
    needs: identities
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: 2.5.16
      - run: pnpm install --frozen-lockfile
      - name: Lint reconciled application components and establishment regression
        run: |
          pnpm exec eslint app/javascript/dashboard/components-next/sidebar/Sidebar.vue \
            app/javascript/dashboard/routes/dashboard/crm/views/contracts/ContractsView.vue \
            app/javascript/dashboard/routes/dashboard/jrcCustomers/components/CompanyEditor.vue \
            app/javascript/dashboard/routes/dashboard/jrcCustomers/components/CompanyEditor.spec.js \
            app/javascript/dashboard/routes/dashboard/jrcOperations/views/ProjectDetail.vue \
            app/javascript/dashboard/routes/dashboard/jrcOperations/views/ProjectList.vue \
            app/javascript/dashboard/routes/dashboard/serviceDesk/components/QuickTicketForm.vue \
            app/javascript/dashboard/routes/dashboard/serviceDesk/views/TicketFormView.vue \
            app/javascript/dashboard/routes/dashboard/jrcRelationship/ConfigurationPanel.vue \
            app/javascript/dashboard/routes/dashboard/jrcRelationship/DocumentMetadataDialog.vue \
            app/javascript/dashboard/routes/dashboard/jrcRelationship/DocumentMetadataDialog.spec.js \
            app/javascript/dashboard/routes/dashboard/jrcRelationship/DocumentsPanel.spec.js \
            app/javascript/dashboard/routes/dashboard/jrcRelationship/distributionConfiguration.spec.js \
            app/javascript/dashboard/routes/dashboard/jrcRelationship/nativeLineage.spec.js \
            app/javascript/dashboard/routes/dashboard/jrcRelationship/operations.spec.js \
            app/javascript/dashboard/routes/dashboard/approvals/specs/policyWizard.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/spec/BackofficeLegacyFlow.spec.js
      - name: Frontend state boundaries, including native Ruby role-ceiling parity
        run: |
          node --test script/jrc_approved_ui_state.test.mjs script/jrc_backoffice_context_privacy.test.mjs \
            script/jrc_calendar_dates.test.mjs script/jrc_calendar_pagination.test.mjs \
            script/jrc_calendar_server_state.test.mjs script/jrc_local_role_boundaries.test.mjs \
            script/jrc_portfolio_history_state.test.mjs script/jrc_requirement_history_state.test.mjs \
            script/jrc_requirement_state.test.mjs
      - name: Vue integration regressions on the exact consolidated source
        run: |
          pnpm exec vitest run app/javascript/dashboard/routes/dashboard/jrcCustomers \
            app/javascript/dashboard/routes/dashboard/jrcRelationship \
            app/javascript/dashboard/routes/dashboard/crm \
            app/javascript/dashboard/routes/dashboard/approvals \
            app/javascript/dashboard/routes/dashboard/jrcOperations \
            app/javascript/dashboard/routes/dashboard/serviceDesk \
            app/javascript/dashboard/components-next/sidebar \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            --reporter=default --reporter=json --outputFile=/tmp/ag-vue-results.json
      - name: Preserve native frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag-frontend-${{ github.sha }}
          path: /tmp/ag-vue-results.json
          if-no-files-found: warn
      - run: git diff --exit-code
