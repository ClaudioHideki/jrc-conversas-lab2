name: Approval Word layout guarded image and real Chrome acceptance
on:
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        description: Exact isolated infrastructure SHA
        type: string
        required: true
      expected_product_sha:
        description: Exact reviewed and tested product SHA
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: single-approvals-word-image-55da80eb
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_EXECUTION_SHA: ${{ inputs.expected_execution_sha }}
  EXPECTED_PRODUCT_SHA: ${{ inputs.expected_product_sha }}
  AUTHORIZED_BUILD_SHA: 55da80eb1254aee54ee0f1fb5c42f2be46a98737
  EXPECTED_APPROVED_SHA: 42a534a0774edff03d56d47707d77ec4de5cfdfd
jobs:
  evidence-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Immutable infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact product source, without infrastructure overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 55da80eb1254aee54ee0f1fb5c42f2be46a98737
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: product/.nvmrc
      - name: Verify independent gate, all native identities and immutable source hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/approvals_consolidated/image_admission.py prepare
      - name: Pin and validate actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/approval-actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --location --fail --silent --show-error --connect-timeout 10 --max-time 60 -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/approval-linter"
          tar -xzf "$archive" -C "$RUNNER_TEMP/approval-linter" actionlint
          "$RUNNER_TEMP/approval-linter/actionlint" .github/workflows/ag-native-candidate.yml
      - name: Denial tests of admission, resource guard, source binding and loopback transport
        env:
          GUARD_TEST_REPORT: ${{ runner.temp }}/guard-tests.json
        run: |
          python3 -B .github/runtime_build/test_guard.py
          python3 -B .github/runtime_build/test_browser_proxy.py
          python3 -B .github/runtime_build/test_guard_integrity.py
          python3 -B .github/approvals_consolidated/test_image_admission.py
          node --check .github/runtime_build/approval_browser.spec.cjs
          node --check .github/runtime_build/approval_browser.config.cjs
          node --test --test-reporter=junit product/script/jrc_vite_build.test.mjs > "$RUNNER_TEMP/vite-heap-tests.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approvals-layout-build-admission-${{ github.sha }}
          path: |
            ${{ runner.temp }}/image-admission-prepare.json
            ${{ runner.temp }}/guard-tests.json
            ${{ runner.temp }}/vite-heap-tests.xml
          if-no-files-found: error
          retention-days: 7
  image-build:
    needs: evidence-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Immutable infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 55da80eb1254aee54ee0f1fb5c42f2be46a98737
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: product/.nvmrc
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: product/package.json
          run_install: false
      - name: Preflight physical and cgroup memory, disk and absence of concurrent Vite
        run: |
          python3 -B - <<'PYTHON'
          import importlib.util, json, os, pathlib, sys
          sys.path.insert(0, '.github/runtime_build')
          import guard
          guard.identity(os.environ)
          limits = guard.limits()
          sample = guard.effective_sample(limits)
          assert sample['ram_available'] >= 8 * 1024**3
          assert sample['disk_free'] >= 3 * 1024**3
          assert limits.resource_reason(sample['disk_free'], sample['ram_available'], starting=True) is None
          limits.no_other_vite_build()
          pathlib.Path(os.environ['RUNNER_TEMP'], 'layout-image-preflight.json').write_text(json.dumps(sample, indent=2))
          print(json.dumps(sample))
          PYTHON
      - name: Native Chrome and pinned Playwright dependencies, without product build
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          command -v google-chrome
          google-chrome --version
          pnpm --dir product/tests/playwright install --frozen-lockfile
          git -C product diff --exit-code
          git diff --exit-code
      - name: Recheck fresh admission and preserved native evidence immediately before build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/approvals_consolidated/image_admission.py build
      - name: Guarded Linux amd64 image, preserved runtime smokes and real desktop/mobile Chrome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/runtime_build/guard.py --execute
      - name: Preserve sanitized smoke, resource and browser evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approvals-layout-image-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/layout-image-preflight.json
            ${{ runner.temp }}/image-admission-build.json
            ${{ runner.temp }}/jrc-runtime-${{ github.run_id }}-1/*.json
            ${{ runner.temp }}/jrc-runtime-${{ github.run_id }}-1/*.log
            ${{ runner.temp }}/jrc-runtime-${{ github.run_id }}-1/*.pdf
            ${{ runner.temp }}/jrc-runtime-${{ github.run_id }}-1/*.png
            ${{ runner.temp }}/jrc-runtime-${{ github.run_id }}-1/*.xlsx
            ${{ runner.temp }}/jrc-runtime-${{ github.run_id }}-1/ocr.txt
            ${{ runner.temp }}/jrc-runtime-${{ github.run_id }}-1/browser/**/*.json
            ${{ runner.temp }}/jrc-runtime-${{ github.run_id }}-1/browser/**/*.png
          if-no-files-found: error
          retention-days: 7
