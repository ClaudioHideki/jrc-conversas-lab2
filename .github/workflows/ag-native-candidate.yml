name: Isolated protocol collision proof (not release validation)

on:
  workflow_dispatch:
    inputs:
      expected_infrastructure_sha:
        description: Exact diagnostic infrastructure SHA
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: runtime-number-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '11111111111111111111111111111111'
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '22222222222222222222222222222222'
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '33333333333333333333333333333333'

jobs:
  diagnostic-before-after-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      POSTGRES_HOST: jrc-rel-v2-pg-20261101
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_rel_v2_candidate_test
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: synthetic-number-proof-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      JRC_BO_TEST_SOCKET_DIRECTORY: /run/jrc-ag-ci-av
      TZ: UTC
      EXPECTED_INFRASTRUCTURE_SHA: ${{ inputs.expected_infrastructure_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin diagnostic identity and prove unmodified baseline model
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$GITHUB_REF_NAME" = ci/runtime-number-collision-proof-20261112
          test "$(git rev-parse HEAD)" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$(git hash-object app/models/jrc_crm/backoffice_request.rb)" = "$(git rev-parse 3f416a50dc13859c57ab4258ad84f2f8c4adbbf1:app/models/jrc_crm/backoffice_request.rb)"
      - name: Owned disposable tools and PostgreSQL only
        env:
          OWNED_PG: ${{ job.services.postgres.id }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(docker inspect "$OWNED_PG" --format '{{json .HostConfig.Binds}}')" = null
          echo '127.0.0.1 jrc-rel-v2-pg-20261101' | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /run/jrc-ag-ci-av
          bash .github/scripts/jrc_ci_apt_setup.sh libpq-dev libvips-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - name: Prepare only the synthetic database
        run: |
          bundle exec rails db:create db:schema:load
          SCHEMA=/tmp/number-proof-schema.rb bundle exec rails db:migrate
      - name: Require deterministic failure in the original generator
        shell: bash
        run: |
          set +e
          bundle exec rspec spec/services/jrc_crm/backoffice_request_number_spec.rb \
            --example 'regenerates an automatically assigned number already used by the same account' \
            --format progress --format json --out /tmp/number-before.json
          before_status=$?
          set -e
          test "$before_status" = 1
          python3 - <<'PYTHON'
          import json
          r=json.load(open('/tmp/number-before.json'));s=r['summary']
          assert s['example_count']==1 and s['failure_count']==1 and s['pending_count']==0 and s['errors_outside_of_examples_count']==0
          e=r['examples'][0]
          assert e['status']=='failed' and e['exception']['class']=='ActiveRecord::RecordInvalid'
          assert 'Request number has already been taken' in e['exception']['message']
          PYTHON
      - name: Apply only the proposed method to this disposable checkout
        run: |
          echo '599bc1fce954fe4bcc58aa98117722628001939b24f77522f178bd0bb90331bd  test/jrc_runtime/backoffice_request_number_candidate.rb.txt' | sha256sum -c -
          cp test/jrc_runtime/backoffice_request_number_candidate.rb.txt app/models/jrc_crm/backoffice_request.rb
          test "$(git diff --name-only)" = app/models/jrc_crm/backoffice_request.rb
          bundle exec ruby -c app/models/jrc_crm/backoffice_request.rb
          bundle exec rubocop --only Lint --format simple app/models/jrc_crm/backoffice_request.rb spec/services/jrc_crm/backoffice_request_number_spec.rb
      - name: Require collision, account, preservation, exhaustion and original scale regressions
        run: |
          bundle exec rspec spec/services/jrc_crm/backoffice_request_number_spec.rb \
            spec/services/jrc_customers/module_segment_filter_scale_spec.rb \
            --format progress --format json --out /tmp/number-after.json
          python3 - <<'PYTHON'
          import json,hashlib,os,pathlib
          r=json.load(open('/tmp/number-after.json'));s=r['summary']
          assert s['example_count']==5 and all(s[k]==0 for k in ['failure_count','pending_count','errors_outside_of_examples_count'])
          assert all(e['status']=='passed' for e in r['examples'])
          p=pathlib.Path('app/models/jrc_crm/backoffice_request.rb')
          result={'diagnostic_infrastructure_sha':os.environ['GITHUB_SHA'],
                  'baseline_product_sha':'3f416a50dc13859c57ab4258ad84f2f8c4adbbf1',
                  'intentional_baseline_failure_verified':True,'corrected_examples':5,
                  'proposed_model_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'full_candidate_validation':False,'docker_build_executed':False}
          pathlib.Path('/tmp/number-proof-result.json').write_text(json.dumps(result,indent=2)+'\n')
          PYTHON
      - name: Preserve both real outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: number-collision-proof-${{ github.sha }}
          path: |
            /tmp/number-before.json
            /tmp/number-after.json
            /tmp/number-proof-result.json
            /tmp/number-proof-schema.rb
          if-no-files-found: error
