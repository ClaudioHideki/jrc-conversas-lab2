            spec/requests/api/v1/accounts/jrc_approvals/approved_financial_adjustments_spec.rb \
            spec/services/jrc_customers/company_import_corporate_scope_spec.rb \
            spec/services/jrc_backoffice/consolidated_migration_identity_spec.rb \
            --seed 20261110 --require ./script/jrc_ag_ci_formatter.rb --format JrcAgCiFormatter --format json --out /tmp/ag-focused-rspec.json
          ruby -rjson -e 'r=JSON.parse(File.read(ARGV.fetch(0))).fetch("summary"); abort "Empty, failed or pending native examples" unless r.fetch("example_count").positive? && r.fetch("failure_count").zero? && r.fetch("pending_count").zero? && r.fetch("errors_outside_of_examples_count").zero?' /tmp/ag-focused-rspec.json
      - name: Authenticated APIs, policies, immutable history, signatures and real transactions
        shell: bash
        run: |
          mapfile -t specs < <(python3 script/jrc_ag_native_plan.py --database "$POSTGRES_DATABASE" --paths --shard-index "${{ matrix.target.shard }}" --shard-count "${{ matrix.target.count }}" --exclusive "${{ matrix.target.exclusive }}")
          test "${#specs[@]}" -gt 0
          bundle exec rspec "${specs[@]}" --seed 20261110 --require ./script/jrc_ag_ci_formatter.rb --format JrcAgCiFormatter --format json --out /tmp/ag-rspec.json
          ruby -rjson -e 'r=JSON.parse(File.read(ARGV.fetch(0))).fetch("summary"); abort "Empty, failed or pending native examples" unless r.fetch("example_count").positive? && r.fetch("failure_count").zero? && r.fetch("pending_count").zero? && r.fetch("errors_outside_of_examples_count").zero?' /tmp/ag-rspec.json
      - name: Preserve synthetic evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag-native-${{ github.sha }}-${{ matrix.installation }}-${{ matrix.target.database }}-${{ matrix.target.shard }}-${{ matrix.target.exclusive }}
          path: |
            /tmp/ag-test-plan.json
            /tmp/ag-rspec.json
            /tmp/ag-focused-rspec.json
