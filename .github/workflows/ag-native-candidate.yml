name: Isolated Docker HTTP port diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_infrastructure_sha:
        type: string
        required: true
      expected_product_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: http-port-diagnostic
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PRODUCT_SHA: ${{ inputs.expected_product_sha }}
      EXPECTED_INFRASTRUCTURE_SHA: ${{ inputs.expected_infrastructure_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_infrastructure_sha }}
          persist-credentials: false
      - name: Verify diagnostic-only identities
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$EXPECTED_PRODUCT_SHA" = 5640793988fbf63ac46b0db3466722fc650f0d01
      - name: Reproduce port metadata and real HTTP in an internal network
        run: python3 -B .github/runtime_build/http_port_diagnostic.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: http-port-diagnostic
          path: ${{ runner.temp }}/http-port-diagnostic/
          if-no-files-found: error
          retention-days: 7
