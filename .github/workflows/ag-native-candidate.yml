name: A-G consolidated native candidate (no publication)

on:
  push:
    branches: [codex/lab2-ag-consolidada-20261110, codex/lab2-ag-atualizacoes-20261112, codex/runtime-alpine324-20261112, codex/runtime-alpine324-numbering-20261112]
  workflow_dispatch:
    inputs:
      expected_validation_sha:
        description: 'Exact immutable consolidated SHA authorized for tests'
        type: string
        required: true
      build_candidate:
        description: 'Execute one guarded consolidated build only after explicit user authorization'
        type: boolean
        default: false
      expected_build_sha:
        description: 'Full SHA explicitly authorized for the consolidated build; separate from d8d7c960'
        type: string
        default: ''

permissions:
  contents: read

# Synthetic encryption keys belong only to disposable CI databases. They allow
# the native MFA regression to execute; no real installation keys are used.
env:
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '11111111111111111111111111111111'
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '22222222222222222222222222222222'
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '33333333333333333333333333333333'

concurrency:
  group: ag-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify exact source for the authorized validation
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VALIDATION_SHA: ${{ inputs.expected_validation_sha }}
        shell: bash
        run: |
          [[ "$EXPECTED_VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_VALIDATION_SHA"
      - name: Validate integrated workflow syntax before native dependencies
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = ClaudioHideki/jrc-conversas-lab2
          url='https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          archive="$RUNNER_TEMP/ci17-actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --location --fail --silent --show-error --connect-timeout 10 --max-time 60 --output "$archive" "$url"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ci17-linter"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ci17-linter" actionlint
          "$RUNNER_TEMP/ci17-linter/actionlint" .github/workflows/ag-native-candidate.yml .github/workflows/projects-portal-candidate.yml .github/workflows/precimech-hotfix-tests.yml .github/workflows/voice-v4-candidate.yml
      - run: git merge-base --is-ancestor d8a83b824b11cc68ddbbce7c79681f368051fb70 HEAD
      - name: Verify disposable APT helper syntax and refusal outside owned CI
        run: |
          bash -n .github/scripts/jrc_ci_apt_setup.sh
          if GITHUB_ACTIONS=false bash .github/scripts/jrc_ci_apt_setup.sh; then exit 1; fi
          if GITHUB_REPOSITORY=unrelated/repository bash .github/scripts/jrc_ci_apt_setup.sh; then exit 1; fi
      - name: Test HTTPS mirror selection with isolated simulated curl and APT
        run: python3 -B .github/scripts/jrc_ci_apt_setup_test.py
      - name: Prove declared runtime and unchanged functional source
        run: python3 -B script/jrc_runtime_contract_test.py /tmp/runtime-contract.json
      - name: Preserve runtime preparation contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-contract-${{ github.sha }}
          path: /tmp/runtime-contract.json
          if-no-files-found: error
      - run: node --test script/validate_ag_migration_identity.test.mjs
      - run: node --test script/validate_migration_timestamps.test.mjs script/validate_ag_historical_migrations.test.mjs
      - run: python3 script/jrc_ag_native_plan_test.py
      - run: python3 script/jrc_ag_catalog_compare_test.py
      - run: python3 script/jrc_ag_guarded_frontend_build_test.py
      - run: python3 script/jrc_ag_guarded_image_build_test.py
      # Known identity collisions must be resolved with a tested history-adoption plan.
      # Never mark the current combined tree as database-ready while this gate fails.
      - run: node script/validate_ag_migration_identity.mjs

  incremental-lint:
    needs: identities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate complete consolidated sources and the exact historical import
        run: >-
          node script/validate_changed_source.mjs d8a83b824b11cc68ddbbce7c79681f368051fb70
          --historical-admission docs/jrc_consolidation/ag_historical_migration_admission_20261111.json
      - name: Same complete increment lint as the native Projects and Portal gate
        shell: bash
        run: |
          baseline=35976b08077035ee79843b07ad02c0389d002f09
          git merge-base --is-ancestor "$baseline" HEAD
          mapfile -t ruby_files < <(git diff --name-only --diff-filter=ACMR "$baseline" HEAD -- '*.rb')
          bundle exec rubocop --force-exclusion --only Lint --format simple "${ruby_files[@]}"
          mapfile -t ui_files < <(git diff --name-only --diff-filter=ACMR "$baseline" HEAD -- app/javascript | grep -E '\.(js|vue)$')
          pnpm exec eslint "${ui_files[@]}"
      - run: git diff --exit-code

  migration-admission:
    needs: [identities, incremental-lint, runtime-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://host.example.test
      POSTGRES_HOST: jrc-rel-v2-pg-20261101
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_rel_v2_candidate_test
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: synthetic-ag-ci-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/ag-fresh-schema.rb
      JRC_AG_FIXTURE_RECEIPT: /tmp/ag-fixture-receipt.json
      JRC_SD_CONCURRENCY: '1'
      JRC_BO_TEST_SOCKET_DIRECTORY: /run/jrc-ag-ci-av
      JRC_REVIEWED_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove disposable service; legacy spec alias exists only on this ephemeral runner
        shell: bash
        env:
          JRC_AG_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{.Id}} {{.Config.Image}}'
          test "$(docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{json .HostConfig.Binds}}')" = null
          echo "JRC_AG_POSTGRES_SERVICE_ID=$JRC_AG_POSTGRES_SERVICE_ID" >> "$GITHUB_ENV"
          echo '127.0.0.1 jrc-rel-v2-pg-20261101' | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /run/jrc-ag-ci-av
          bash .github/scripts/jrc_ci_apt_setup.sh libpq-dev libvips-dev imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - name: Prove fresh, pinned-main upgrade and real schema reload on three new databases
        shell: bash
        run: |
          bundle exec rails db:create db:migrate
          bundle exec rails db:migrate
          bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          bundle exec rails db:schema:dump
          JRC_AG_CATALOG_OUTPUT=/tmp/ag-fresh-catalog.json bundle exec rails runner script/jrc_ag_ci_fixture.rb catalog
          POSTGRES_DATABASE=jrc_jornada_candidate_test bundle exec rails db:create
          POSTGRES_DATABASE=jrc_jornada_candidate_test JRC_AG_POPULATED_UPGRADE=1 bundle exec rails runner script/jrc_ag_ci_fixture.rb load_main
          POSTGRES_DATABASE=jrc_jornada_candidate_test SCHEMA=/tmp/ag-upgrade-schema.rb bundle exec rails db:migrate
          POSTGRES_DATABASE=jrc_jornada_candidate_test SCHEMA=/tmp/ag-upgrade-schema.rb bundle exec rails db:migrate
          POSTGRES_DATABASE=jrc_jornada_candidate_test bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          POSTGRES_DATABASE=jrc_jornada_candidate_test bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          POSTGRES_DATABASE=jrc_jornada_candidate_test JRC_AG_CATALOG_OUTPUT=/tmp/ag-upgrade-catalog.json bundle exec rails runner script/jrc_ag_ci_fixture.rb catalog
          POSTGRES_DATABASE=jrc_four_domains_schema_test bundle exec rails db:create db:schema:load
          POSTGRES_DATABASE=jrc_four_domains_schema_test bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          POSTGRES_DATABASE=jrc_four_domains_schema_test JRC_AG_FIXTURE_RECEIPT=/tmp/ag-reload-receipt.json bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          POSTGRES_DATABASE=jrc_four_domains_schema_test JRC_AG_CATALOG_OUTPUT=/tmp/ag-reload-catalog.json bundle exec rails runner script/jrc_ag_ci_fixture.rb catalog
          python3 script/jrc_ag_catalog_compare.py /tmp/ag-fresh-catalog.json /tmp/ag-upgrade-catalog.json /tmp/ag-reload-catalog.json
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib
          manifest = json.loads(pathlib.Path('docs/jrc_consolidation/ag_historical_migration_admission_20261111.json').read_text())
          receipt = json.loads(pathlib.Path('/tmp/ag-fixture-receipt-execution.json').read_text())
          assert receipt['populated_upgrade'] and receipt['preserved_subjects'] >= 10
          assert len(receipt['required_versions']) == 36 and len(receipt['historical_versions']) == 27
          assert receipt['missing_after'] == [] and receipt['pending_after'] is False and receipt['existing_versions_preserved']
          paths = ['/tmp/ag-fresh-schema.rb', '/tmp/ag-upgrade-schema.rb',
                   '/tmp/ag-fresh-catalog.json', '/tmp/ag-upgrade-catalog.json', '/tmp/ag-reload-catalog.json']
          result = {'source_sha': os.environ['GITHUB_SHA'], 'base_sha': manifest['base_sha'],
                    'schema_paths_passed': ['fresh_migrate_and_reexecute', 'populated_main_upgrade_and_reexecute', 'empty_schema_reload'],
                    'catalog_equivalence_passed': True, 'upgrade': receipt,
                    'sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
                    'production_changed': False, 'docker_build_executed': False}
          pathlib.Path('/tmp/ag-migration-audit-result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Migration audit for ' + result['source_sha'] + ': 36 applied versions (27 historical), ' +
                           str(receipt['preserved_subjects']) + ' preserved synthetic subjects; fresh/upgrade/reload passed.\n')
          print(json.dumps(result))
          PYTHON
      - name: Preserve actual synthetic catalogs and generated schema, including failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag-migration-admission-${{ github.sha }}
          path: |
            /tmp/ag-fresh-schema.rb
            /tmp/ag-upgrade-schema.rb
            /tmp/ag-*-catalog*.json
            /tmp/ag-fixture-receipt.json
            /tmp/ag-*-execution.json
            /tmp/ag-migration-audit-result.json
          if-no-files-found: warn

  native-focused:
    needs: [identities, migration-admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        installation: [fresh, upgrade]
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://host.example.test
      POSTGRES_HOST: jrc-rel-v2-pg-20261101
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_rel_v2_candidate_test
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: synthetic-ag-ci-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/ag-focused-schema.rb
      JRC_AG_FIXTURE_RECEIPT: /tmp/ag-fixture-receipt.json
      JRC_SD_CONCURRENCY: '1'
      JRC_BO_TEST_SOCKET_DIRECTORY: /run/jrc-ag-ci-av
      JRC_REVIEWED_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove disposable service; legacy spec alias exists only on this ephemeral runner
        shell: bash
        env:
          JRC_AG_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{.Id}} {{.Config.Image}}'
          test "$(docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{json .HostConfig.Binds}}')" = null
          echo "JRC_AG_POSTGRES_SERVICE_ID=$JRC_AG_POSTGRES_SERVICE_ID" >> "$GITHUB_ENV"
          echo '127.0.0.1 jrc-rel-v2-pg-20261101' | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /run/jrc-ag-ci-av
          bash .github/scripts/jrc_ci_apt_setup.sh libpq-dev libvips-dev imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - name: Admit only an empty disposable native database
        run: bundle exec rails db:create
      - name: Reproduce pinned main before the focused upgrade scenarios
        if: matrix.installation == 'upgrade'
        run: bundle exec rails runner script/jrc_ag_ci_fixture.rb load_main
      - name: Verify native migrations and the retained synthetic account
        run: |
          bundle exec rails db:migrate
          bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
      - name: Reproduce corrected native failures before the full regression matrix
        shell: bash
        run: |
          bundle exec rspec \
            spec/services/jrc_flows/ownership_effects_spec.rb \
            spec/services/jrc_service_desk/internal_intake_integration_spec.rb \
            spec/services/jrc_crm/nexora_end_to_end_spec.rb \
            spec/requests/api/v1/accounts/relationship/sofia_operational_journey_spec.rb \
            spec/requests/api/v1/accounts/relationship/native_completions_spec.rb \
            spec/requests/api/v1/accounts/crm/commercial_flow_spec.rb \
            spec/requests/api/v1/accounts/relationship/survey_models_integrated_spec.rb \
            spec/services/jrc_relationship/survey_models_delivery_spec.rb \
            --seed 20261110 --require ./script/jrc_ag_ci_formatter.rb --format JrcAgCiFormatter --format json --out /tmp/ag-focused-rspec.json
          ruby -rjson -e 'r=JSON.parse(File.read(ARGV.fetch(0))).fetch("summary"); abort "Empty, failed or pending native examples" unless r.fetch("example_count").positive? && r.fetch("failure_count").zero? && r.fetch("pending_count").zero? && r.fetch("errors_outside_of_examples_count").zero?' /tmp/ag-focused-rspec.json
      - name: Preserve focused native failures and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ag-native-focused-${{ github.sha }}-${{ matrix.installation }}
          path: /tmp/ag-focused-rspec.json
          if-no-files-found: warn

  rails:
    needs: [identities, migration-admission, native-focused]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        installation: [fresh, upgrade]
        target:
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 1, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 2, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 3, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 4, count: 6, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 5, count: 6, exclusive: ''}
          - {database: jrc_four_domains_schema_admission_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_rel_sd_candidate_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_jornada_candidate_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_four_domains_schema_authority_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_four_domains_schema_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_ag_retention_native_test, shard: 0, count: 1, exclusive: ''}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: signing_identity}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: document_scan}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: contract_version}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: signature_integration}
          - {database: jrc_rel_v2_candidate_test, shard: 0, count: 1, exclusive: signature_connection}
          - {database: jrc_jornada_candidate_test, shard: 0, count: 1, exclusive: reviewed_operations}
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://host.example.test
      POSTGRES_HOST: jrc-rel-v2-pg-20261101
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: ${{ matrix.target.database }}
      JRC_AG_EXCLUSIVE_SPEC: ${{ matrix.target.exclusive }}
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: synthetic-ag-ci-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/ag-schema.rb
      JRC_AG_FIXTURE_RECEIPT: /tmp/ag-fixture-receipt.json
      JRC_SD_CONCURRENCY: '1'
      JRC_BO_TEST_SOCKET_DIRECTORY: /run/jrc-ag-ci-av
      JRC_REVIEWED_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove disposable service; legacy spec alias exists only on this ephemeral runner
        shell: bash
        env:
          JRC_AG_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{.Id}} {{.Config.Image}}'
          test "$(docker inspect "$JRC_AG_POSTGRES_SERVICE_ID" --format '{{json .HostConfig.Binds}}')" = null
          echo "JRC_AG_POSTGRES_SERVICE_ID=$JRC_AG_POSTGRES_SERVICE_ID" >> "$GITHUB_ENV"
          echo '127.0.0.1 jrc-rel-v2-pg-20261101' | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /run/jrc-ag-ci-av
          bash .github/scripts/jrc_ci_apt_setup.sh libpq-dev libvips-dev imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - name: Plan every native example source, respecting existing database guards
        run: python3 script/jrc_ag_native_plan.py > /tmp/ag-test-plan.json
      - name: Create exclusive empty test database
        run: bundle exec rails db:create
      - name: Reproduce pinned main and its actual migration ledger
        if: matrix.installation == 'upgrade'
        run: bundle exec rails runner script/jrc_ag_ci_fixture.rb load_main
      - name: Native migrations and idempotent reexecution
        run: |
          bundle exec rails db:migrate
          bundle exec rails runner script/jrc_ag_ci_fixture.rb validate_constraints
          bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          bundle exec rails db:migrate
          bundle exec rails runner script/jrc_ag_ci_fixture.rb verify
          bundle exec rails zeitwerk:check
      - name: Focused cumulative and integration regressions before the broad suite
