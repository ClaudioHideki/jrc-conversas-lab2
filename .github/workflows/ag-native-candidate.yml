name: Focused Scout and Sidekiq probe validation (no image build)

on:
  workflow_dispatch:
    inputs:
      expected_infrastructure_sha:
        description: Immutable focused-test infrastructure SHA
        required: true
        type: string
      expected_product_sha:
        description: Immutable reviewed Scout correction SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scout-probe-fix-tests
  cancel-in-progress: false

env:
  EXPECTED_PRODUCT_SHA: ${{ inputs.expected_product_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  focused-alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable test infrastructure and product
        env:
          EXPECTED_INFRASTRUCTURE_SHA: ${{ inputs.expected_infrastructure_sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF_NAME" = ci/runtime-scout-probe-fix-20261112
          test "$GITHUB_SHA" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$EXPECTED_PRODUCT_SHA" = d11c879a3d6e27499e1aea45736797a6e913b829
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d11c879a3d6e27499e1aea45736797a6e913b829
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
      - name: Actionlint and Bash/Ruby syntax
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 90 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ag-native-candidate.yml
          bash -n .github/runtime_fix/alpine.sh
          for file in .github/runtime_build/{receipt,worker,probe,test_receipt}.rb .github/runtime_fix/*.rb; do ruby -c "$file"; done
      - name: Lock contract, boundary regressions and preserved migration guards
        working-directory: product
        run: |
          python3 -B script/jrc_runtime_contract_test.py "$RUNNER_TEMP/runtime-contract.json"
          python3 -B script/jrc_runtime_contract_test_test.py
          node --test script/validate_ag_migration_identity.test.mjs script/validate_migration_timestamps.test.mjs script/validate_ag_historical_migrations.test.mjs
          node script/validate_ag_migration_identity.mjs
          git diff --exit-code
      - name: Sidekiq receipt positive PID and negative identity/persistence cases
        run: ruby .github/runtime_build/test_receipt.rb "$RUNNER_TEMP/receipt-unit.json"
      - name: Native Scout compile regression on exact Alpine base and actual PID 1
        run: bash .github/runtime_fix/alpine.sh
      - name: Preserve focused native and static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scout-alpine-${{ github.sha }}
          path: |
            ${{ runner.temp }}/scout-results/
            ${{ runner.temp }}/runtime-contract.json
            ${{ runner.temp }}/receipt-unit.json
          if-no-files-found: error

  native-runtime:
    needs: focused-alpine
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      JRC_RUNTIME_CANDIDATE: '1'
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_runtime_compatibility_20261112_test
      REDIS_URL: redis://127.0.0.1:6379/14
      FRONTEND_URL: https://host.example.test
      SECRET_KEY_BASE: synthetic-runtime-ci-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/scout-fix-schema.rb
      TZ: UTC
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '11111111111111111111111111111111'
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '22222222222222222222222222222222'
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '33333333333333333333333333333333'
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d11c879a3d6e27499e1aea45736797a6e913b829
          path: product
          persist-credentials: false
          fetch-depth: 0
      - name: Exclusive service identity and signed HTTPS APT dependencies
        env:
          RUNTIME_PG_ID: ${{ job.services.postgres.id }}
          RUNTIME_REDIS_ID: ${{ job.services.redis.id }}
          EXPECTED_INFRASTRUCTURE_SHA: ${{ inputs.expected_infrastructure_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_INFRASTRUCTURE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(docker inspect "$RUNTIME_PG_ID" --format '{{json .HostConfig.Binds}}')" = null
          test "$(docker inspect "$RUNTIME_REDIS_ID" --format '{{json .HostConfig.Binds}}')" = null
          bash .github/scripts/jrc_ci_apt_setup.sh libpq-dev libvips libvips-dev fonts-dejavu-core imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
          working-directory: product
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: product/.nvmrc
      - name: Frozen reviewed lock and native migrations on disposable database
        run: |
          bundle check
          git diff --exit-code -- Gemfile Gemfile.lock
          bundle exec rails db:create db:migrate
      - name: Real Scout allocation hooks and separate Sidekiq PostgreSQL/Redis receipt
        run: bundle exec ruby ../.github/runtime_fix/native_check.rb
      - name: Existing native runtime and authenticated report-export regressions
        run: |
          bundle exec rspec test/jrc_runtime/runtime_compatibility_spec.rb spec/requests/api/v1/accounts/jrc_service_desk/report_exports_spec.rb --format progress --format json --out "$RUNNER_TEMP/runtime-rspec.json"
          ruby -rjson -e 's=JSON.parse(File.read(ARGV.fetch(0))).fetch("summary"); abort "Invalid native report" unless s.fetch("example_count").positive? && s.fetch("failure_count").zero? && s.fetch("pending_count").zero? && s.fetch("errors_outside_of_examples_count").zero?' "$RUNNER_TEMP/runtime-rspec.json"
          git diff --exit-code
      - name: Preserve native results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scout-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-rspec.json
            ${{ runner.temp }}/receipt-native.json
            ${{ runner.temp }}/receipt-sidekiq.log
            ${{ runner.temp }}/runtime-sidekiq.log
            /tmp/scout-fix-schema.rb
          if-no-files-found: error
