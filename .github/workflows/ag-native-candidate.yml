name: Isolated Broker LAB2 history media acceptance
on:
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        type: string
        required: true
      expected_product_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: quick-release-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  history-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      LAB2_SHA: 1224ea08421f4ef98723dd8238ccadac446c2ce4
      BROKER_SHA: c3bae632ea9df9cf263c98a503f5c262f5872a3a
      EXPECTED_EXECUTION_SHA: ${{ inputs.expected_execution_sha }}
      EXPECTED_PRODUCT_SHA: ${{ inputs.expected_product_sha }}
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1224ea08421f4ef98723dd8238ccadac446c2ce4
          fetch-depth: 0
          path: lab2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClaudioHideki/BrokerJRCIA
          ref: c3bae632ea9df9cf263c98a503f5c262f5872a3a
          path: broker
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify exact products and an exclusively owned hosted runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = ClaudioHideki/jrc-conversas-lab2
          test "$GITHUB_SHA" = "$EXPECTED_EXECUTION_SHA"
          test "$EXPECTED_PRODUCT_SHA" = "$LAB2_SHA"
          test "$(git -C lab2 rev-parse HEAD)" = "$LAB2_SHA"
          test "$(git -C broker rev-parse HEAD)" = "$BROKER_SHA"
          test "$(df --output=avail -B1 . | tail -1)" -gt 15000000000
          test "$(awk '/MemAvailable/ {print $2}' /proc/meminfo)" -gt 8388608
          echo "EVIDENCE=$RUNNER_TEMP/quick-history-evidence" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/quick-history-evidence"
      - name: Validate this exact isolated workflow with checksum-pinned actionlint
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --location --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          git -C lab2 show "$GITHUB_SHA":.github/workflows/ag-native-candidate.yml > "$RUNNER_TEMP/history-e2e.yml"
          "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/history-e2e.yml"
      - name: Install only the exact Broker test dependencies
        working-directory: broker
        run: npm ci --ignore-scripts
      - name: Build the unchanged Dockerfile test target using its pinned runtime
        run: |
          set -euo pipefail
          docker build --file lab2/docker/Dockerfile --target pre-builder \
            --build-arg RAILS_ENV=test --build-arg BUNDLE_WITHOUT= \
            --build-arg GIT_SHA="$LAB2_SHA" \
            --build-arg GRPC_RUBY_BUILD_PROCS=2 --build-arg NODE_OPTIONS=--max-old-space-size=2048 \
            --label com.jrc.test=jrc-history-v2-complete-20261112 \
            --tag jrc-history-test:current lab2 > "$EVIDENCE/test-runtime-build.log" 2>&1
          docker run --rm --entrypoint ruby jrc-history-test:current -e 'abort "Wrong test Ruby" unless RUBY_VERSION=="3.4.12" && RUBY_PATCHLEVEL==148'
      - name: Prepare the exact source archive and verified MinIO fixture
        run: |
          set -euo pipefail
          git -C lab2 archive "$LAB2_SHA" > "$EVIDENCE/rails-current.tar"
          cp broker/labs/history-sync-lab2/rails-initializer.rb "$EVIDENCE/history-rails-initializer.rb"
          cp broker/labs/history-sync-lab2/http-data.rb "$EVIDENCE/history-http-data.rb"
          cp broker/labs/history-sync-lab2/start-rails.sh "$EVIDENCE/history-start-rails.sh"
          cp broker/labs/history-sync-lab2/start-sidekiq.sh "$EVIDENCE/history-start-sidekiq.sh"
          cp broker/labs/history-sync-lab2/prepare-storage.rb "$EVIDENCE/history-prepare-storage.rb"
          node --input-type=module -e 'import {downloadVerifiedFixture} from "./broker/scripts/ci/storage-minio.mjs";await downloadVerifiedFixture(process.env.EVIDENCE+"/minio")'
          cat > "$EVIDENCE/Dockerfile.minio" <<'MINIO'
          FROM docker.io/library/ruby:3.4.12-alpine3.24@sha256:a28982cf8ed78eb0d222e51bc6788335d33ef191bfc6fc39da138577e611741d
          COPY minio /usr/local/bin/minio
          ENTRYPOINT ["/usr/local/bin/minio"]
          CMD ["server","/data"]
          MINIO
          docker build --file "$EVIDENCE/Dockerfile.minio" --tag jrc-history-minio:verified "$EVIDENCE" > "$EVIDENCE/minio-build.log" 2>&1
      - name: Create only named synthetic databases, queues and private storage
        run: |
          set -euo pipefail
          docker context create desktop-linux --docker host=unix:///var/run/docker.sock
          docker network create jrc-history-release-test
          for name in broker-history-native-pg-20261112 jrc-history-v2-complete-20261112-pg jrc-history-v2-complete-20261112-redis jrc-history-v2-e2e-minio-20261112 jrc-history-v2-http-20261112 jrc-history-v2-sidekiq-20261112; do
            if docker container inspect "$name" >/dev/null 2>&1; then exit 1; fi
          done
          docker run -d --network jrc-history-release-test --name broker-history-native-pg-20261112 \
            --label com.jrc.test=broker-history-native-20261112 --memory 384m \
            -p 127.0.0.1:55433:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=jrc_test_history_admin \
            pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          docker run -d --network jrc-history-release-test --name jrc-history-v2-complete-20261112-pg \
            --label com.jrc.test=jrc-history-v2-complete-20261112 --memory 384m \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=jrc_history_order_test \
            pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          docker run -d --network jrc-history-release-test --name jrc-history-v2-complete-20261112-redis \
            --label com.jrc.test=jrc-history-v2-complete-20261112 --memory 96m \
            redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
          docker run -d --network jrc-history-release-test --name jrc-history-v2-e2e-minio-20261112 \
            --network-alias jrc-history-v2-complete-20261112-minio \
            --label com.jrc.test=jrc-history-v2-complete-20261112 --memory 384m -p 127.0.0.1:59000:9000 \
            -e MINIO_ROOT_USER=synthetic-history-only -e MINIO_ROOT_PASSWORD=synthetic-disposable-history-only jrc-history-minio:verified
          for name in broker-history-native-pg-20261112 jrc-history-v2-complete-20261112-pg; do
            for _ in $(seq 1 60); do
              if docker exec "$name" pg_isready -U postgres >/dev/null 2>&1; then break; fi
              sleep 1
            done
            docker exec "$name" pg_isready -U postgres
          done
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:59000/minio/health/cluster >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:59000/minio/health/cluster
          cat > "$RUNNER_TEMP/history-test.env" <<'ENVFILE'
          RAILS_ENV=test
          NODE_ENV=test
          HISTORY_LAB_MODE=true
          POSTGRES_HOST=jrc-history-v2-complete-20261112-pg
          POSTGRES_USERNAME=postgres
          POSTGRES_DATABASE=jrc_history_order_test
          REDIS_URL=redis://jrc-history-v2-complete-20261112-redis:6379/1
          FRONTEND_URL=http://127.0.0.1:54141
          SECRET_KEY_BASE=synthetic-history-ci-not-production
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=11111111111111111111111111111111
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=22222222222222222222222222222222
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=33333333333333333333333333333333
          JRC_BROKER_CREDENTIAL_KEY=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          JRC_BROKER_ENABLED=true
          JRC_HISTORY_SYNC_V2_ENABLED=true
          STORAGE_ENDPOINT=http://jrc-history-v2-e2e-minio-20261112:9000
          STORAGE_REGION=us-east-1
          STORAGE_FORCE_PATH_STYLE=true
          STORAGE_BUCKET_NAME=synthetic-jrc-history-20261112
          STORAGE_ACCESS_KEY_ID=synthetic-history-only
          STORAGE_SECRET_ACCESS_KEY=synthetic-disposable-history-only
          HISTORY_PHYSICAL_STORAGE_TEST=true
          SCHEMA=/tmp/history-schema.rb
          ENVFILE
          chmod 600 "$RUNNER_TEMP/history-test.env"
      - name: Migrate and prove native history, private media and Minhas isolation
        run: |
          set -euo pipefail
          docker run --rm --network jrc-history-release-test --env-file "$RUNNER_TEMP/history-test.env" \
            --entrypoint bundle jrc-history-test:current exec rails db:migrate > "$EVIDENCE/migration.log" 2>&1
          docker run --rm --network jrc-history-release-test --env-file "$RUNNER_TEMP/history-test.env" \
            -e STORAGE_ENDPOINT=http://jrc-history-v2-complete-20261112-minio:9000 -e STORAGE_BUCKET_NAME=synthetic-history-20261112 \
            --mount "type=bind,src=$EVIDENCE,dst=/evidence" --entrypoint sh jrc-history-test:current -eu -c '
            mkdir -p /testapp
            tar -xf /evidence/rails-current.tar -C /testapp
            cd /testapp
            exec bundle exec rspec \
            spec/requests/jrc_history_sync_v2_spec.rb spec/services/jrc_broker/history_sync_media_spec.rb \
            spec/services/jrc_broker/history_sync_contract_canonical_spec.rb spec/services/jrc_broker/history_media_body_limit_spec.rb \
            spec/requests/api/v1/accounts/conversations_member_inboxes_spec.rb spec/services/conversations/shared_inbox_routing_spec.rb \
            spec/services/conversations/inbox_visibility_exclusive_spec.rb \
            --format json --out /evidence/history-native.json --format progress' > "$EVIDENCE/history-native.log" 2>&1
          node -e 'const r=require(process.env.EVIDENCE+"/history-native.json").summary;if(!r.example_count||r.failure_count||r.pending_count||r.errors_outside_of_examples_count)process.exit(1)'
      - name: Start real Rails and only the private media Sidekiq queue
        run: |
          set -euo pipefail
          docker run -d --network jrc-history-release-test --name jrc-history-v2-http-20261112 \
            --label com.jrc.test=jrc-history-v2-complete-20261112 --memory 1500m -p 127.0.0.1:54141:3000 \
            --env-file "$RUNNER_TEMP/history-test.env" --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            --entrypoint sh jrc-history-test:current /evidence/history-start-rails.sh
          docker run -d --network jrc-history-release-test --name jrc-history-v2-sidekiq-20261112 \
            --label com.jrc.test=jrc-history-v2-complete-20261112 --memory 1500m \
            --env-file "$RUNNER_TEMP/history-test.env" --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            --entrypoint sh jrc-history-test:current /evidence/history-start-sidekiq.sh
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:54141/api >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:54141/api
          docker exec -w /testapp jrc-history-v2-http-20261112 bundle exec rails runner /evidence/history-prepare-storage.rb
      - name: Reconcile source, Broker, private bytes and two authorized Rails consumers
        working-directory: broker
        env:
          HISTORY_LAB2_E2E: 'true'
          HISTORY_LAB2_ORIGIN: http://127.0.0.1:54141
          HISTORY_LAB_RAILS_CONTAINER: jrc-history-v2-http-20261112
          HISTORY_LAB_MINIO_ENDPOINT: http://127.0.0.1:59000
          HISTORY_LAB_MINIO_ACCESS: synthetic-history-only
          HISTORY_LAB_MINIO_SECRET: synthetic-disposable-history-only
          TEST_DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:55433/jrc_test_history_admin
        run: |
          set -euo pipefail
          export HISTORY_LAB2_CHECKOUT="$GITHUB_WORKSPACE/lab2"
          HISTORY_LAB_HTTP_KEY="$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update("synthetic-history-http:"+Buffer.from("a".repeat(32)).toString("base64")).digest("hex"))')"
          export HISTORY_LAB_HTTP_KEY
          npm run test:integration -- apps/api/tests/integration/history-sync-lab2.test.ts \
            --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$EVIDENCE/history-e2e.json" > "$EVIDENCE/history-e2e.log" 2>&1
          npm run test:integration -- apps/api/tests/integration/history-sync-operational-lab2.test.ts \
            --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$EVIDENCE/history-operational-e2e.json" > "$EVIDENCE/history-operational-e2e.log" 2>&1
          node -e 'for(const n of ["history-e2e.json","history-operational-e2e.json"]){const r=require(process.env.EVIDENCE+"/"+n);if(!r.success||!r.numTotalTests||r.numFailedTests||r.numPendingTests)process.exit(1)}'
          printf '{"lab2_sha":"%s","broker_sha":"%s","real_whatsapp_session":false,"private_storage":true,"redis_sidekiq":true}\n' "$LAB2_SHA" "$BROKER_SHA" > "$EVIDENCE/source-identities.json"
      - name: Preserve bounded synthetic evidence and stop only owned test containers
        if: always()
        run: |
          set -euo pipefail
          for name in jrc-history-v2-http-20261112 jrc-history-v2-sidekiq-20261112; do
            if test "$(docker inspect --format '{{index .Config.Labels "com.jrc.test"}}' "$name" 2>/dev/null)" = jrc-history-v2-complete-20261112; then
              docker logs --tail 100 "$name" > "$EVIDENCE/$name.log" 2>&1
            fi
          done
          for name in jrc-history-v2-http-20261112 jrc-history-v2-sidekiq-20261112 jrc-history-v2-e2e-minio-20261112 jrc-history-v2-complete-20261112-redis jrc-history-v2-complete-20261112-pg broker-history-native-pg-20261112; do
            label="$(docker inspect --format '{{index .Config.Labels "com.jrc.test"}}' "$name" 2>/dev/null || true)"
            case "$label" in
              jrc-history-v2-complete-20261112|broker-history-native-20261112) docker rm -f "$name" ;;
              '') ;;
              *) exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: history-media-exact-${{ inputs.expected_product_sha }}
          path: |
            ${{ runner.temp }}/quick-history-evidence/*.json
            ${{ runner.temp }}/quick-history-evidence/*.log
          if-no-files-found: error
          retention-days: 7

