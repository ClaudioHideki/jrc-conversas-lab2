name: Approval simulator localized selection reproduction (no build)
on:
  workflow_dispatch:
    inputs:
      expected_validation_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: approval-layout-${{ github.ref }}
  cancel-in-progress: false
env:
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '11111111111111111111111111111111'
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '22222222222222222222222222222222'
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '33333333333333333333333333333333'
jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable candidate and preservation
        env:
          EXPECTED_SHA: ${{ inputs.expected_validation_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor 5640793988fbf63ac46b0db3466722fc650f0d01 HEAD
          test -z "$(git diff --name-only 5640793988fbf63ac46b0db3466722fc650f0d01 HEAD -- db docker Gemfile Gemfile.lock pnpm-lock.yaml enterprise)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: node script/validate_ag_migration_identity.mjs
      - run: node --test script/validate_ag_migration_identity.test.mjs script/validate_migration_timestamps.test.mjs script/validate_ag_historical_migrations.test.mjs
  frontend:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Lint modified frontend
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR 5640793988fbf63ac46b0db3466722fc650f0d01 HEAD -- app/javascript | grep -E '\.(js|vue)$')
          pnpm exec eslint "${files[@]}"
      - name: Existing approval and workspace Vue regressions
        run: pnpm exec vitest run app/javascript/dashboard/routes/dashboard/approvals/specs/simulatorSelection.spec.js --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=/tmp/approvals-vue.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approvals-vue-${{ github.sha }}
          path: /tmp/approvals-vue.json
          if-no-files-found: error
