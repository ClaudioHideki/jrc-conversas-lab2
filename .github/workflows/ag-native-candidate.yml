name: Approval Word layout independent release evidence gate
on:
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: approvals-word-independent-gate
  cancel-in-progress: false
jobs:
  evidence-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_EXECUTION_SHA: ${{ inputs.expected_execution_sha }}
      EXPECTED_SOURCE_PRODUCT_SHA: d68885508f36a8fda2725a3c03d78470e9f9ff70
      EXPECTED_VALIDATION_SHA: 77bef89d84eb523a1fab8a725a70a5a700a80dd9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 77bef89d84eb523a1fab8a725a70a5a700a80dd9
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d68885508f36a8fda2725a3c03d78470e9f9ff70
          path: image_source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: image_source/.nvmrc
      - name: Immutable hosted authorization
        run: |
          [[ "$EXPECTED_EXECUTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_EXECUTION_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_EXECUTION_SHA"
          test "$GITHUB_REF_NAME" = ci/approvals-word-release-gate-20261113
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Pin and validate actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/approval-actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --location --fail --silent --show-error --connect-timeout 10 --max-time 60 -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/approval-linter"
          tar -xzf "$archive" -C "$RUNNER_TEMP/approval-linter" actionlint
          "$RUNNER_TEMP/approval-linter/actionlint" .github/workflows/ag-native-candidate.yml
      - name: Preserve original evidence, Scout and resource denial tests
        env:
          GATE_TEST_REPORT: ${{ runner.temp }}/gate-tests.json
          GUARD_TEST_REPORT: ${{ runner.temp }}/guard-tests.json
          SCOUT_PROOF_TEST_REPORT: ${{ runner.temp }}/scout-proof-tests.json
        run: |
          python3 -B .github/release/test_gate.py
          python3 -B .github/release/test_scout_probe.py
          python3 -B .github/runtime_build/test_guard.py
          python3 -B .github/layout_release/test_layout_release_adapter.py
      - name: Revalidate frontend-only heap contract
        run: node --test --test-reporter=junit image_source/script/jrc_vite_build.test.mjs > "$RUNNER_TEMP/vite-heap-tests.xml"
      - name: Independently verify native artifacts and exact functional source equivalence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/layout_release/layout_release_adapter.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approvals-layout-release-gate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gate-tests.json
            ${{ runner.temp }}/guard-tests.json
            ${{ runner.temp }}/scout-proof-tests.json
            ${{ runner.temp }}/vite-heap-tests.xml
            ${{ runner.temp }}/validated-native-tree.json
            ${{ runner.temp }}/layout-release-gate-report.json
          if-no-files-found: error
          retention-days: 7
