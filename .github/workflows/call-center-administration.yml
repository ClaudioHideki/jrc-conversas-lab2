              assert 'jrc_cc_nico_txn_' in proof['queue'] and proof['known_transport_faults_are_injected'] is True
              assert proof['source_line'] in examples and proof['source_line'] not in lines
              assert all(isinstance(row, list) and len(row) == 1 and isinstance(row[0], int) for row in proof['queued_arguments'])
              lines.add(proof['source_line'])
          assert lines == examples
          PY
