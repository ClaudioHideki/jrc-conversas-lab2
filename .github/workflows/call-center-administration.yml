          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report = json.loads(Path('/tmp/call-center-ending-nico-queue-rspec.json').read_text())
          assert report['summary']['example_count'] == len(report['examples']) == 14
          assert all(report['summary'][key] == 0 for key in ['failure_count', 'pending_count', 'errors_outside_of_examples_count'])
          assert all(row['status'] == 'passed' for row in report['examples'])
          examples = {row['line_number'] for row in report['examples']}
