name: Call Center stages 0-2 - isolated native validation
on:
  push:
    branches: [codex/call-center-control-desk-20261116]
  workflow_dispatch:
    inputs:
      expected_sha:
        type: string
        required: true
        description: Exact immutable candidate SHA
permissions:
  contents: read
concurrency:
  group: call-center-administration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    # Prior complete run took 102m41s; retain a finite allowance for M18's
    # populated upgrade and 49 additional native cases without dropping gates.
    timeout-minutes: 135
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_sd_bc_portal_concurrency_20261025_test
      JRC_SD_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      REDIS_URL: redis://127.0.0.1:6379/15
      FRONTEND_URL: http://127.0.0.1:5386
      SECRET_KEY_BASE: isolated-call-center-test-only-not-an-installation-secret
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '11111111111111111111111111111111'
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '22222222222222222222222222222222'
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '33333333333333333333333333333333'
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/call-center-schema.rb
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm immutable identity and disposable resources
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          test "$GITHUB_REF_NAME" = codex/call-center-control-desk-20261116
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git merge-base --is-ancestor a24adc6dd8bb660f955b76cce0172ae1638deee2 HEAD
          git diff --check a24adc6dd8bb660f955b76cce0172ae1638deee2 HEAD
          python3 -B script/jrc_call_center_workflow_check_test.py
          python3 -B script/jrc_call_center_workflow_check.py .github/workflows/call-center-administration.yml
          python3 -B script/jrc_call_center_chrome_counter_test.py
          free -h
          df -h /
      - name: Native dependencies over verified HTTPS APT
        run: |
          bash -n .github/scripts/jrc_ci_apt_setup.sh
          bash .github/scripts/jrc_ci_apt_setup.sh libpq-dev libvips libvips-dev fonts-dejavu-core postgresql-client poppler-utils ffmpeg libclamav12
          command -v pdftotext
          pdftotext -v
      - name: Own synthetic ClamAV engine and real bounded media tools
        run: |
          bash -n .github/scripts/jrc_cc_native_audio_tools.sh
          bash .github/scripts/jrc_cc_native_audio_tools.sh
      - uses: ruby/setup-ruby@v1
        id: ruby_runtime
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Preserve migration identities and unchanged historical source
        run: |
          node --test script/validate_ag_migration_identity.test.mjs script/validate_migration_timestamps.test.mjs script/validate_ag_historical_migrations.test.mjs
          node script/validate_ag_migration_identity.mjs
          node --test script/validate_cc_access_migration.test.mjs script/validate_cc_ending_scope_migration.test.mjs script/validate_cc_ending_version_migration.test.mjs
          node --test --test-concurrency=1 tests/playwright/tests/e2e/ui/call-center-browser-api.test.mjs tests/playwright/tests/e2e/ui/call-center-text-contrast.test.mjs
          node --test script/validate_cc_ending_origin_migration.test.mjs script/validate_cc_ending_origin_admission.test.mjs
          node --test script/validate_cc_ending_readiness_migration.test.mjs script/validate_cc_ending_readiness_admission.test.mjs
          node --test script/validate_cc_ending_execution_migration.test.mjs script/validate_cc_ending_execution_admission.test.mjs
          node --test script/validate_cc_ending_attempt_migration.test.mjs script/validate_cc_ending_attempt_admission.test.mjs
          node --test script/validate_cc_nico_intent_admission.test.mjs
          node --test script/validate_cc_typed_destination_admission.test.mjs
          node --test script/validate_cc_quality_review_admission.test.mjs
          node --test script/validate_cc_recording_task_admission.test.mjs
          node script/validate_cc_access_migration.mjs
      - name: Frozen frontend dependencies
        id: frontend_dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint of changed sources
        id: frontend_lint
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR a24adc6dd8bb660f955b76cce0172ae1638deee2 HEAD -- app/javascript | grep -E '\.(js|vue)$')
          pnpm exec eslint "${files[@]}"
      - name: Native CRM destination navigation and existing Lead workflows
        run: |
          pnpm exec vitest run app/javascript/dashboard/routes/dashboard/crm/views/leads/spec/LeadHistoryNavigation.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/leads/spec/LeadsIndex.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/leads/spec/LeadNativeActions.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/leads/spec/LeadCreateModal.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/leads/spec/LeadCreateAuthority.spec.js \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            --reporter=default --reporter=json --outputFile=/tmp/call-center-native-lead-vitest.json
      - name: Focused Service Desk and direct audio preview controls with retained editor cases
        run: |
          pnpm exec vitest run app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/EndingServiceDeskConfiguration.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/EndingAutomationEditor.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/AudioLibraryPreview.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/AudioAssetLibrary.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/composables/useEndingAutomationEditor.spec.js \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            --reporter=default --reporter=json --outputFile=/tmp/call-center-ending-sd-public-vitest.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/call-center-ending-sd-public-vitest.json').read_text())
          assert report['numTotalTests'] == report['numPassedTests'] == 110
          assert report['numFailedTests'] == report['numPendingTests'] == 0
          assert len(report['testResults']) == 5
          assert all(row['status'] == 'passed' for row in report['testResults'])
          expected = {'useEndingAutomationEditor.spec.js': 27, 'AudioAssetLibrary.spec.js': 51, 'AudioLibraryPreview.spec.js': 10, 'EndingAutomationEditor.spec.js': 10, 'EndingServiceDeskConfiguration.spec.js': 12}
          assert {Path(row['name']).name: len(row['assertionResults']) for row in report['testResults']} == expected
          assert all(case['status'] == 'passed' for row in report['testResults'] for case in row['assertionResults'])
          PY
      - name: Focused native recordings selection, shared player and retained ACW target controls
        run: |
          node --test --test-reporter=tap tests/playwright/tests/e2e/ui/call-center-text-contrast-dispatch.test.mjs > /tmp/call-center-contrast-dispatch.txt
          cat /tmp/call-center-contrast-dispatch.txt
          python3 -B - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          raw = Path('/tmp/call-center-contrast-dispatch.txt').read_bytes()
          values = {key: int(value) for key, value in re.findall(r'^# (tests|pass|fail|cancelled|skipped|todo) (\d+)$', raw.decode(), re.M)}
          assert values == {'tests': 4, 'pass': 4, 'fail': 0, 'cancelled': 0, 'skipped': 0, 'todo': 0}
          files = ['tests/playwright/tests/e2e/ui/call-center-text-contrast.mjs', 'tests/playwright/tests/e2e/ui/call-center-text-contrast-dispatch.test.mjs']
          proof = {'sha': os.environ['GITHUB_SHA'], 'tests': values, 'TAP_sha256': hashlib.sha256(raw).hexdigest(),
                   'source_sha256': {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in files},
                   'no_browser_CSS_or_application_acceptance_claimed': True}
          Path('/tmp/call-center-contrast-dispatch.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
          node --test --test-reporter=tap tests/playwright/tests/e2e/ui/call-center-owned-media-failure.test.mjs > /tmp/call-center-owned-media-failure.txt
          cat /tmp/call-center-owned-media-failure.txt
          python3 -B - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          raw = Path('/tmp/call-center-owned-media-failure.txt').read_bytes()
          values = {key: int(value) for key, value in re.findall(r'^# (tests|pass|fail|cancelled|skipped|todo) (\d+)$', raw.decode(), re.M)}
          assert values == {'tests': 4, 'pass': 4, 'fail': 0, 'cancelled': 0, 'skipped': 0, 'todo': 0}
          files = ['tests/playwright/tests/e2e/ui/call-center-owned-media-failure.mjs', 'tests/playwright/tests/e2e/ui/call-center-owned-media-failure.test.mjs', 'tests/playwright/tests/e2e/ui/call-center-recording-context-native.mjs']
          proof = {'sha': os.environ['GITHUB_SHA'], 'tests': values, 'TAP_sha256': hashlib.sha256(raw).hexdigest(),
                   'source_sha256': {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in files},
                   'no_native_media_or_application_acceptance_claimed': True}
          Path('/tmp/call-center-owned-media-failure.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
          pnpm exec vitest run app/javascript/dashboard/routes/dashboard/jrcContactCenter/composables/useScopedRecordings.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/ScopedNativeRecordingPlayer.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/AcwRuleTarget.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/RecordingDetailsDialog.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/RecordingAccessHistory.spec.js \
            app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/QualityReviewDialog.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/RecordingTranscript.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/RecordingCallContext.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/QualityReviewHistory.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/RecordingEndingActions.spec.js app/javascript/dashboard/routes/dashboard/jrcContactCenter/components/RecordingAnalysis.spec.js \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
