          python3 -B - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/call-center-recordings-preflight-vitest.json').read_text())
          assert report['numTotalTests'] == report['numPassedTests'] == 172
          assert report['numFailedTests'] == report['numPendingTests'] == 0
          assert len(report['testResults']) == 14 and all(row['status'] == 'passed' for row in report['testResults'])
          expected = {'useScopedRecordings.spec.js': 28, 'ScopedNativeRecordingPlayer.spec.js': 11, 'AcwRuleTarget.spec.js': 10, 'RecordingDetailsDialog.spec.js': 13, 'RecordingAccessHistory.spec.js': 13, 'QualityReviewDialog.spec.js': 13, 'RecordingTranscript.spec.js': 10, 'RecordingCallContext.spec.js': 10, 'QualityReviewHistory.spec.js': 10, 'RecordingEndingActions.spec.js': 11, 'RecordingAnalysis.spec.js': 8}
          expected.update({'EndingTaskState.spec.js': 12, 'RecordingManualTasks.spec.js': 14, 'RecordingTaskCreate.spec.js': 9})
          assert {Path(row['name']).name: len(row['assertionResults']) for row in report['testResults']} == expected
          assert all(case['status'] == 'passed' for row in report['testResults'] for case in row['assertionResults'])
          expected_new = {'EndingTaskState.spec.js': 12, 'RecordingManualTasks.spec.js': 14, 'RecordingTaskCreate.spec.js': 9}
          for name, count in expected_new.items():
              row, = [entry for entry in report['testResults'] if Path(entry['name']).name == name]
              assert row['status'] == 'passed' and len(row['assertionResults']) == count
          PY
      - name: Official RuboCop server parity without reducing inspected coverage
        run: |
          python3 -B script/jrc_call_center_lint_server_probe_test.py
          python3 -B script/jrc_call_center_lint_server_probe.py
