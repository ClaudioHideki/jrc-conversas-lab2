          bundle exec rubocop app/services/jrc_contact_center/ending_actions/source_authority.rb app/services/jrc_contact_center/ending_actions/original_actor_context.rb app/services/jrc_contact_center/ending_actions/native_trigger.rb app/services/jrc_contact_center/ending_actions/pinned_rule.rb spec/services/jrc_contact_center/ending_actions/source_authority_spec.rb spec/services/jrc_contact_center/ending_actions/native_trigger_spec.rb spec/services/jrc_contact_center/ending_actions/pinned_rule_spec.rb spec/requests/api/v1/accounts/jrc_contact_center/ending_original_actor_concurrency_spec.rb --format json --out /tmp/call-center-ending-origin-guards-lint.json
          bundle exec rubocop app/services/jrc_contact_center/ending_actions/project_task_destination.rb spec/services/jrc_contact_center/ending_actions/project_task_destination_spec.rb spec/services/jrc_contact_center/ending_actions/project_task_destination_privacy_spec.rb --format json --out /tmp/call-center-ending-origin-project-lint.json
          bundle exec rubocop app/models/jrc_contact_center/ending_action_readiness.rb app/services/jrc_contact_center/ending_actions/activate_rule.rb app/services/jrc_contact_center/ending_actions/execution_readiness.rb db/migrate/20261123235000_create_contact_center_ending_action_readinesses.rb lib/jrc_contact_center/ending_action_readiness_schema_receipt.rb script/jrc_call_center_ending_readiness_schema_probe.rb script/jrc_call_center_ending_readiness_upgrade.rb spec/services/jrc_contact_center/ending_actions/activate_rule_spec.rb spec/services/jrc_contact_center/ending_actions/execution_readiness_spec.rb spec/models/jrc_contact_center/ending_action_readiness_spec.rb spec/services/jrc_contact_center/create_contact_center_ending_action_readinesses_spec.rb spec/services/jrc_contact_center/synthetic_ending_readiness_upgrade_spec.rb spec/requests/api/v1/accounts/jrc_contact_center/ending_readiness_concurrency_spec.rb spec/support/contact_center_ending_origin_schema_dependencies.rb --format json --out /tmp/call-center-ending-readiness-lint.json
