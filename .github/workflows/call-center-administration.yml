              assert report['summary']['example_count'] == len(report['examples']) == count
              assert all(report['summary'][key] == 0 for key in ['failure_count', 'pending_count', 'errors_outside_of_examples_count'])
              assert all(row['status'] == 'passed' for row in report['examples'])
          attempt_upgrade = json.loads(Path('/tmp/call-center-ending-attempt-upgrade.json').read_text())
          assert attempt_upgrade['sha'] == os.environ['GITHUB_SHA'] and attempt_upgrade['synthetic'] is True
          assert attempt_upgrade['exact_old_columns_and_values_preserved'] and attempt_upgrade['rerun_idempotent']
          assert len(attempt_upgrade['preserved_records']) == 17
          assert attempt_upgrade['queued_attempts'] == attempt_upgrade['terminal_outcomes'] == attempt_upgrade['operational_effects_delta'] == 0
          assert attempt_upgrade['existing_tasks_preserved'] == 2 and attempt_upgrade['successful_receipts_preserved'] == 1
          attempt_executions = [row for row in concurrency['examples'] if row['file_path'].removeprefix('./') == 'spec/requests/api/v1/accounts/jrc_contact_center/ending_attempt_execution_concurrency_spec.rb']
          assert len(attempt_executions) == 22 and all(row['status'] == 'passed' for row in attempt_executions)
          native_dispatch = [row for row in concurrency['examples'] if row['file_path'].removeprefix('./') == 'spec/requests/api/v1/accounts/jrc_contact_center/ending_dispatch_native_spec.rb']
          assert len(native_dispatch) == 15 and all(row['status'] == 'passed' for row in native_dispatch)
          expected_history = {
              'spec/requests/api/v1/accounts/jrc_contact_center/ending_attempt_history_spec.rb': 17,
              'spec/requests/api/v1/accounts/jrc_contact_center/ending_attempt_history_concurrency_spec.rb': 2,
          }
          for history_path, required_cases in expected_history.items():
              history_examples = [row for row in concurrency['examples'] if row['file_path'].removeprefix('./') == history_path]
              assert len(history_examples) == required_cases and all(row['status'] == 'passed' for row in history_examples)
              assert len({row['full_description'] for row in history_examples}) == required_cases
          assert editor_surfaces['desktop-light'] != editor_surfaces['desktop-dark']
          assert editor_surfaces['mobile-light'] != editor_surfaces['mobile-dark']
          pause_flows = list(Path('.codex/call-center-native-e2e').glob('*-pause-approval-native.json'))
          assert len(pause_flows) == 4
          for proof_path in pause_flows:
              proof = json.loads(proof_path.read_text())
              assert proof['sha'] == os.environ['GITHUB_SHA'] and proof['synthetic'] is True
              assert proof['approved_scope_count'] == proof['requested_scope_count'] == 2
              assert proof['first_scope_did_not_apply'] and proof['full_approval_waited_for_acw'] and proof['reload_persisted']
              assert proof['denied_other_unit'] and proof['no_administrative_access']
              assert proof['final_state'] == 'paused' and proof['provider_confirmed'] is False
              assert not proof['errors'] and not proof['provider_writes']
          assignee = json.loads(Path('/tmp/call-center-ending-assignee-preflight.json').read_text())
          assert assignee['summary']['example_count'] == len(assignee['examples']) == 2
          assert all(assignee['summary'][key] == 0 for key in ['failure_count', 'pending_count', 'errors_outside_of_examples_count'])
          assert all(row['status'] == 'passed' for row in assignee['examples'])
          activation = json.loads(Path('/tmp/call-center-ending-activation-preflight.json').read_text())
          assert activation['summary']['example_count'] == len(activation['examples']) == 24
          assert all(activation['summary'][key] == 0 for key in ['failure_count', 'pending_count', 'errors_outside_of_examples_count'])
          assert all(row['status'] == 'passed' for row in activation['examples'])
          activation_flows = [json.loads(path.read_text()) for path in Path('.codex/call-center-native-e2e').glob('*-ending-activation-native.json')]
          assert len(activation_flows) == 4 and {row['project'] for row in activation_flows} == expected_projects
          assert len({row['account_id'] for row in activation_flows}) == 4
          for flow in activation_flows:
              assert flow['sha'] == os.environ['GITHUB_SHA'] and flow['synthetic'] is True
              assert flow['activation_status'] == 200 and flow['stale_status'] == 409 and flow['denied_status'] in [401, 403]
              assert all(flow[key] is True for key in ['persisted_reload_verified', 'explicit_same_key_replay_verified', 'no_implicit_UI_post'])
              assert flow['UI_post_count'] == 2
              assert type(flow['native_task_count_before']) is int and flow['native_task_count_before'] >= 0
              assert flow['native_task_count_after'] == flow['native_task_count_before']
              assert flow['actual_dark_theme'] is flow['project'].endswith('dark')
              assert flow['contrast']['ratio'] >= 4.5
              assert not flow['errors'] and not flow['prohibited_provider_or_destination_writes']
              assert flow['call_or_broker_operations_claimed'] is False
              expected_images = {f".codex/call-center-native-e2e/{flow['project']}-ending-activation-{stage}.png" for stage in ['review', 'recorded', 'stale']}
              assert len(flow['screenshots']) == 3 and set(flow['screenshots']) == expected_images
              assert all(Path(path).is_file() for path in expected_images)
          vue = json.loads(Path('/tmp/call-center-vitest.json').read_text())
          assert vue['numPassedTests'] == vue['numTotalTests'] > 0
          assert vue['numFailedTests'] == vue['numPendingTests'] == 0
          selected_vue = [row for row in vue['testResults'] if row['name'].replace('\\', '/').endswith('/app/javascript/dashboard/routes/dashboard/inbox/usePendingEndingRun.spec.js')]
          assert len(selected_vue) == 1 and selected_vue[0]['status'] == 'passed'
          selected_cases = selected_vue[0]['assertionResults']
          assert len(selected_cases) == len({row['fullName'] for row in selected_cases}) == 15
          assert all(row['status'] == 'passed' and not row.get('failureMessages') for row in selected_cases)
          history_vue = [row for row in vue['testResults'] if row['name'].replace('\\', '/').endswith('/app/javascript/dashboard/routes/dashboard/inbox/useEndingAttemptHistory.spec.js')]
          assert len(history_vue) == 1 and history_vue[0]['status'] == 'passed'
          history_assertions = history_vue[0]['assertionResults']
          assert len(history_assertions) == len({row['fullName'] for row in history_assertions}) == 23
          assert all(row['status'] == 'passed' and not row.get('failureMessages') for row in history_assertions)
          history_flows = [json.loads(path.read_text()) for path in Path('.codex/call-center-native-e2e').glob('*-ending-history-native.json')]
          assert len(history_flows) == 4 and {row['project'] for row in history_flows} == expected_projects
          assert len({row['account_id'] for row in history_flows}) == 4
          for flow in history_flows:
              assert flow['sha'] == os.environ['GITHUB_SHA'] and flow['synthetic'] is True
              assert flow['native_immutable_attempts'] == 23 and flow['pending'] == 20
              assert flow['succeeded'] == flow['blocked'] == flow['failed'] == 1
              assert flow['synthetic_persistence_fault_injection'] is True
              assert flow['native_task_total_before'] == flow['native_task_total_after'] == 1
              assert flow['persisted_after_reload'] and flow['native_task_route_opened']
              assert flow['ordinary_other_agent_status'] in [401, 403]
              assert flow['actual_dark'] is flow['project'].endswith('dark')
              assert flow['contrast_ratio'] >= 4.5
              assert len(flow['state_contrast_ratios']) == 4 and all(ratio >= 4.5 for ratio in flow['state_contrast_ratios'])
              assert not flow['page_errors'] and not flow['prohibited_mutations_or_external_calls']
              images = {f".codex/call-center-native-e2e/{flow['project']}-ending-history-{stage}.png" for stage in ['pending-page', 'independent-outcomes', 'native-task']}
              assert len(flow['screenshots']) == 3 and set(flow['screenshots']) == images
              assert all(Path(image).is_file() for image in images)
              assert flow['whole_figure10_or_Part1_accepted'] is False
          pending_flows = [json.loads(path.read_text()) for path in Path('.codex/call-center-native-e2e').glob('*-ending-pending-native.json')]
          assert len(pending_flows) == 4 and {row['project'] for row in pending_flows} == expected_projects
          assert len({row['account_id'] for row in pending_flows}) == 4
          for flow in pending_flows:
              assert flow['sha'] == os.environ['GITHUB_SHA'] and flow['synthetic'] is True
              assert all(flow[key] is True for key in ['original_actor_nonadministrator', 'only_selected_POST', 'explicit_confirmation',
                                                     'immutable_other_pending_preserved', 'persisted_after_reload'])
              assert flow['native_tasks_before'] == 0 and flow['native_tasks_after'] == 1
              assert flow['completed_replay_status'] == 409 and flow['another_agent_denied_status'] in [401, 403]
              assert len(flow['mutations']) == 1 and flow['mutations'][0]['confirmed'] is True
              assert set(flow['mutations'][0]) == {'confirmed', 'expected_version_id', 'expected_request_key'}
              assert flow['actual_dark'] is flow['project'].endswith('dark') and flow['contrast_ratio'] >= 4.5
              assert not flow['page_errors'] and not flow['prohibited_mutations_or_external_calls']
              assert flow['whole_figure10_or_Part1_accepted'] is False
              images = {f".codex/call-center-native-e2e/{flow['project']}-ending-pending-{stage}.png" for stage in ['explicit-review', 'selected-only-outcome', 'native-task']}
              assert len(flow['screenshots']) == 3 and set(flow['screenshots']) == images
              assert all(Path(image).is_file() for image in images)
          ending_preflight = json.loads(Path('/tmp/call-center-ending-confirmation-preflight.json').read_text())['summary']
          scope_preflight = json.loads(Path('/tmp/call-center-ending-scope-preflight.json').read_text())['summary']
          version_preflight = json.loads(Path('/tmp/call-center-ending-version-preflight.json').read_text())['summary']
          evidence = {
              'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'source_matrix_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'rails': summaries, 'vue': {key: vue[key] for key in ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests']},
              'chrome': stats, 'matrix': matrix,
              'ending_confirmation_preflight': {key: ending_preflight[key] for key in ['example_count', 'failure_count', 'pending_count', 'errors_outside_of_examples_count']},
              'ending_scope_preflight': {key: scope_preflight[key] for key in ['example_count', 'failure_count', 'pending_count', 'errors_outside_of_examples_count']},
              'ending_version_preflight': {key: version_preflight[key] for key in ['example_count', 'failure_count', 'pending_count', 'errors_outside_of_examples_count']},
              'stages_0_2_complete': False, 'external_homologation': False,
              'screenshots': {str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                              for path in sorted(Path('.codex/call-center-native-e2e').rglob('*.png'))},
          }
          Path('/tmp/call-center-acceptance.json').write_text(json.dumps(evidence, indent=2) + '\n')
