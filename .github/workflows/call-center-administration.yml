        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RAILS_ENV" = test
          test "$POSTGRES_HOST" = 127.0.0.1
          test "$POSTGRES_DATABASE" = corporate_gratuity_disposable
          test "$REDIS_URL" = redis://127.0.0.1:6379/15
          bundle exec rspec spec/requests/api/v1/accounts/jrc_contact_center/ending_native_nico_queue_transaction_spec.rb --format progress --format json --out /tmp/call-center-ending-nico-queue-rspec.json
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report = json.loads(Path('/tmp/call-center-ending-nico-queue-rspec.json').read_text())
          assert report['summary']['example_count'] == len(report['examples']) == 14
          assert all(report['summary'][key] == 0 for key in ['failure_count', 'pending_count', 'errors_outside_of_examples_count'])
          assert all(row['status'] == 'passed' for row in report['examples'])
          examples = {row['line_number'] for row in report['examples']}
          proofs = list(Path('/tmp').glob('call-center-ending-nico-queue-*.json'))
          proofs = [path for path in proofs if path.name != 'call-center-ending-nico-queue-rspec.json']
          assert len(proofs) == 14
          lines = set()
          source = Path('spec/requests/api/v1/accounts/jrc_contact_center/ending_native_nico_queue_transaction_spec.rb')
          for path in proofs:
              proof = json.loads(path.read_text())
              assert proof['synthetic'] is True and proof['worker_or_provider_execution'] is False
              assert proof['source_sha'] == os.environ['GITHUB_SHA']
              assert proof['actual_database'] == 'corporate_gratuity_disposable' and proof['actual_Redis_database'] == 15
              assert isinstance(proof['native_backend_pid'], int) and proof['native_backend_pid'] > 0
