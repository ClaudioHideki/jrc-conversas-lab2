              'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'source_matrix_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'rails': summaries, 'vue': {key: vue[key] for key in ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests']},
              'chrome': stats, 'matrix': matrix,
              'native_lead_navigation': {key: native_leads[key] for key in ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests']},
              'ending_confirmation_preflight': {key: ending_preflight[key] for key in ['example_count', 'failure_count', 'pending_count', 'errors_outside_of_examples_count']},
              'ending_scope_preflight': {key: scope_preflight[key] for key in ['example_count', 'failure_count', 'pending_count', 'errors_outside_of_examples_count']},
              'ending_version_preflight': {key: version_preflight[key] for key in ['example_count', 'failure_count', 'pending_count', 'errors_outside_of_examples_count']},
              'stages_0_2_complete': False, 'external_homologation': False,
              'screenshots': {str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                              for path in sorted(Path('.codex/call-center-native-e2e').rglob('*.png'))},
          }
          Path('/tmp/call-center-acceptance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Preserve source identity
        if: always()
        run: git diff --exit-code && git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: call-center-native-${{ github.sha }}
          path: |
            /tmp/call-center-*.json
            /tmp/call-center-*.txt
            /tmp/call-center-*.log
            /tmp/call-center-schema.rb
            /tmp/call-center-typed-upgrade-schema.rb
            /tmp/call-center-quality-upgrade-schema.rb
            .codex/call-center-native-e2e
          if-no-files-found: error
