name: Call Center stages 0-2 - isolated native validation
on:
  push:
    branches: [codex/call-center-control-desk-20261116]
  workflow_dispatch:
    inputs:
      expected_sha:
        type: string
        required: true
        description: Exact immutable candidate SHA
permissions:
  contents: read
concurrency:
  group: call-center-administration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_sd_bc_portal_concurrency_20261025_test
      JRC_SD_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      REDIS_URL: redis://127.0.0.1:6379/15
      FRONTEND_URL: http://127.0.0.1:5386
      SECRET_KEY_BASE: isolated-call-center-test-only-not-an-installation-secret
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: '11111111111111111111111111111111'
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: '22222222222222222222222222222222'
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: '33333333333333333333333333333333'
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/call-center-schema.rb
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm immutable identity and disposable resources
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          test "$GITHUB_REF_NAME" = codex/call-center-control-desk-20261116
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git merge-base --is-ancestor a24adc6dd8bb660f955b76cce0172ae1638deee2 HEAD
          git diff --check a24adc6dd8bb660f955b76cce0172ae1638deee2 HEAD
          free -h
          df -h /
      - name: Native dependencies over verified HTTPS APT
        run: |
          bash .github/scripts/jrc_ci_apt_setup.sh libpq-dev libvips libvips-dev fonts-dejavu-core postgresql-client poppler-utils
          command -v pdftotext
          pdftotext -v
      - uses: ruby/setup-ruby@v1
        id: ruby_runtime
        with:
          ruby-version: '3.4.12'
          bundler: 2.5.16
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Preserve migration identities and unchanged historical source
        run: |
          node --test script/validate_ag_migration_identity.test.mjs script/validate_migration_timestamps.test.mjs script/validate_ag_historical_migrations.test.mjs
          node script/validate_ag_migration_identity.mjs
          node --test script/validate_cc_access_migration.test.mjs
          node script/validate_cc_access_migration.mjs
      - name: Disposable application schema and pending migrations
        run: |
          test "$RAILS_ENV" = test
          test "$POSTGRES_HOST" = 127.0.0.1
          test "$POSTGRES_DATABASE" = jrc_sd_bc_portal_concurrency_20261025_test
          SCHEMA=db/schema.rb bundle exec rails db:create db:schema:load
          bundle exec rails db:migrate
      - name: Reload migrated schema in a separate disposable database
        env:
          POSTGRES_DATABASE: jrc_cc_access_schema_reload_synthetic
          SCHEMA: /tmp/call-center-schema.rb
        run: |
          test "$RAILS_ENV" = test
          test "$POSTGRES_HOST" = 127.0.0.1
          test "$POSTGRES_DATABASE" = jrc_cc_access_schema_reload_synthetic
          bundle exec rails db:create db:schema:load
          bundle exec rails runner 'c=ActiveRecord::Base.connection; t=:jrc_contact_center_access_grants; abort "missing access constraints" unless c.foreign_keys(t).length == 3 && c.check_constraints(t).length == 4; abort "unexpected grants" unless JrcContactCenter::AccessGrant.count.zero?'
          bundle exec rspec spec/models/jrc_contact_center/ivr_draft_ledger_spec.rb --format progress --format json --out /tmp/call-center-ivr-schema-reload-rspec.json
      - name: Rails authorization, persistence and affected regressions
        run: |
          bundle exec rspec spec/services/jrc_contact_center spec/models/jrc_contact_center \
            spec/requests/api/v1/accounts/jrc_contact_center spec/jobs/jrc_contact_center \
            spec/services/pabx spec/requests/api/v1/accounts/pabx_spec.rb \
            spec/requests/api/v1/accounts/pabx_security_spec.rb spec/requests/api/v1/accounts/pabx_history_spec.rb \
            spec/requests/api/v1/accounts/pabx_recordings_spec.rb spec/requests/api/v1/accounts/pabx_diagnostics_spec.rb \
            spec/requests/api/v1/accounts/call_history_spec.rb spec/services/jrc_voice_quality \
            spec/controllers/api/v1/accounts/teams_controller_spec.rb spec/controllers/api/v1/accounts/team_members_controller_spec.rb \
            spec/controllers/api/v1/accounts/agents_controller_spec.rb spec/enterprise/controllers/api/v1/accounts/agents_controller_spec.rb \
            spec/enterprise/controllers/api/v1/accounts/custom_roles_controller_spec.rb spec/enterprise/models/custom_role_spec.rb \
            spec/enterprise/models/contact_center_custom_role_audit_spec.rb spec/enterprise/controllers/api/v1/accounts/audit_logs_controller_spec.rb \
            spec/services/jrc_crm/corporate_coverage_spec.rb spec/models/jrc_crm/organizational_structure_spec.rb \
            spec/services/jrc_crm/current_structure_scopes_spec.rb \
            spec/requests/api/v1/accounts/crm/corporate_company_scope_spec.rb \
            spec/services/jrc_operator/commands_spec.rb \
            --exclude-pattern '**/sync_concurrency_spec.rb,**/native_role_concurrency_spec.rb,**/native_configuration_concurrency_spec.rb,**/ivr_draft_concurrency_spec.rb,**/native_team_scope_concurrency_spec.rb,**/native_operating_origins_spec.rb' \
            --format progress --format json --out /tmp/call-center-rspec.json
      - name: Legacy isolated ACW value compatibility (not a persistence proof)
        run: bundle exec ruby spec/standalone/voice_acw_policy_test.rb
      - name: PABX concurrency in its explicitly guarded disposable database
        env:
          POSTGRES_DATABASE: corporate_gratuity_disposable
          SCHEMA: /tmp/call-center-pabx-schema.rb
        run: |
          SCHEMA=db/schema.rb bundle exec rails db:create db:schema:load
          bundle exec rails db:migrate
          bundle exec rspec spec/services/pabx/sync_concurrency_spec.rb spec/requests/api/v1/accounts/jrc_contact_center/native_role_concurrency_spec.rb spec/requests/api/v1/accounts/jrc_contact_center/native_configuration_concurrency_spec.rb spec/requests/api/v1/accounts/jrc_contact_center/ivr_draft_concurrency_spec.rb spec/requests/api/v1/accounts/jrc_contact_center/native_team_scope_concurrency_spec.rb spec/requests/api/v1/accounts/jrc_contact_center/native_operating_origins_spec.rb --format progress --format json --out /tmp/call-center-pabx-rspec.json
      - name: Affected Approvals and Backoffice in their guarded disposable candidate database
        env:
          POSTGRES_DATABASE: jrc_rel_v2_candidate_test
          SCHEMA: /tmp/call-center-corporate-schema.rb
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RAILS_ENV" = test
          test "$POSTGRES_HOST" = 127.0.0.1
          test "$POSTGRES_DATABASE" = jrc_rel_v2_candidate_test
          SCHEMA=db/schema.rb bundle exec rails db:create db:schema:load
          bundle exec rails db:migrate
          bundle exec rspec spec/services/jrc_approvals/core_spec.rb spec/services/jrc_backoffice/authority_proposals_spec.rb spec/services/jrc_backoffice/signer_rosters_spec.rb --format progress --format json --out /tmp/call-center-corporate-rspec.json
      - name: Require positive examples and zero failures, pending or outside errors
        run: >-
          ruby -rjson -e 'ARGV.each { |path| s=JSON.parse(File.read(path)).fetch("summary"); abort s.inspect unless s.fetch("example_count").positive? && s.fetch("failure_count").zero? && s.fetch("pending_count").zero? && s.fetch("errors_outside_of_examples_count").zero? }' /tmp/call-center-rspec.json /tmp/call-center-pabx-rspec.json /tmp/call-center-ivr-schema-reload-rspec.json /tmp/call-center-corporate-rspec.json
      - name: Supabase storage guards in a separate synthetic database
        env:
          PGPASSWORD: disposable-test-only
        run: |
          createdb -h 127.0.0.1 -U postgres jrc_quality_storage_synthetic
          psql -h 127.0.0.1 -U postgres -d jrc_quality_storage_synthetic -f spec/sql/voice_quality_scope_test.sql | tee /tmp/call-center-storage.txt
      - name: Frozen frontend dependencies
        id: frontend_dependencies
        run: pnpm install --frozen-lockfile
      - name: Syntax and migration timestamp protections
        run: node script/validate_changed_source.mjs a24adc6dd8bb660f955b76cce0172ae1638deee2
      - name: Vue administrative workflows and affected telephony integration
        run: |
          pnpm exec vitest run app/javascript/dashboard/routes/dashboard/jrcContactCenter app/javascript/dashboard/routes/dashboard/jrcCustomers/components/ContactDetailsDialog.spec.js app/javascript/dashboard/routes/dashboard/jrcCustomers/components/MasterContactDetails.spec.js \
            app/javascript/dashboard/routes/dashboard/webphone app/javascript/dashboard/routes/dashboard/settings/customRoles \
            app/javascript/dashboard/components/widgets/BackButton.spec.js \
            --maxWorkers=1 --minWorkers=1 --no-file-parallelism \
            --reporter=default --reporter=json --outputFile=/tmp/call-center-vitest.json
      - name: Frontend lint of changed sources
        id: frontend_lint
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR a24adc6dd8bb660f955b76cce0172ae1638deee2 HEAD -- app/javascript | grep -E '\.(js|vue)$')
          pnpm exec eslint "${files[@]}"
      - name: Incremental Ruby lint without suppressing new offenses
        id: ruby_lint
        if: always() && steps.ruby_runtime.outcome == 'success'
        run: |
          python3 -B script/jrc_call_center_lint_test.py
          python3 -B script/jrc_call_center_lint.py
      - name: Record unavailable formatter prerequisites
        if: failure() && steps.frontend_dependencies.outcome != 'success' && (steps.frontend_lint.outcome == 'failure' || steps.ruby_lint.outcome == 'failure')
        env:
          FRONTEND_DEPENDENCIES_OUTCOME: ${{ steps.frontend_dependencies.outcome }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = {
              'status': 'not_run', 'reason': 'frontend_dependencies_not_successful',
              'frontend_dependencies_outcome': os.environ['FRONTEND_DEPENDENCIES_OUTCOME'],
              'mandatory_rails_and_lint_gates_preserved': True,
              'ruby_report': '/tmp/call-center-rubocop.json',
          }
          Path('/tmp/call-center-formatter-unavailable.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Preserve safe formatter suggestions without changing candidate source
        if: failure() && steps.frontend_dependencies.outcome == 'success' && (steps.frontend_lint.outcome == 'failure' || steps.ruby_lint.outcome == 'failure')
        run: python3 -B script/jrc_call_center_lint_suggestions.py
      - name: Guarded build of real CSS and components for the isolated Chrome test
        env:
          JRC_VITE_BUILD_HEAP_MIB: '6144'
        run: |
          node script/jrc_vite_build.mjs build --mode production --config tests/playwright/fixtures/call-center-native/vite.config.mjs | tee /tmp/call-center-frontend-build.txt
          pnpm --dir tests/playwright install --frozen-lockfile --ignore-scripts
          google-chrome --version | tee /tmp/call-center-chrome-version.txt
      - name: Synthetic authenticated Rails and isolated preview
        run: |
          bundle exec rails runner script/jrc_call_center_e2e_seed.rb
          bundle exec rails server -b 127.0.0.1 -p 5387 > /tmp/call-center-rails-server.private 2>&1 &
          echo "$!" > /tmp/call-center-rails.pid
          node node_modules/vite/bin/vite.js preview --config tests/playwright/fixtures/call-center-native/vite.config.mjs > /tmp/call-center-preview.private 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:5387/app/login && curl --fail --silent --output /dev/null http://127.0.0.1:5386/; then exit 0; fi
            sleep 2
          done
          echo 'Isolated servers did not become ready; no external fallback permitted'
          exit 1
      - name: Require actual Chrome bootstrap before the full UI assertions
        run: node tests/playwright/fixtures/call-center-native/probe.mjs
      - name: Chrome desktop and mobile, real CSS and PostgreSQL persistence
        run: |
          node tests/playwright/node_modules/@playwright/test/cli.js test --config tests/playwright/call-center-native.config.ts
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('.codex/call-center-native-e2e/results.json').read_text())
          stats = report['stats']
          assert stats['expected'] == 148
          assert stats['unexpected'] == stats['skipped'] == stats['flaky'] == 0
          assert not report.get('errors')
          source = Path('docs/jrc_contact_center/stages_0_2_review_20261116.json')
          matrix = json.loads(source.read_text())
          assert sorted(row['figure'] for row in matrix['figures']) == list(range(1, 24))
          summaries = {}
          for name in ['call-center-rspec.json', 'call-center-pabx-rspec.json', 'call-center-ivr-schema-reload-rspec.json', 'call-center-corporate-rspec.json']:
              summary = json.loads(Path('/tmp', name).read_text())['summary']
              assert summary['example_count'] > 0
              assert summary['failure_count'] == summary['pending_count'] == summary['errors_outside_of_examples_count'] == 0
              summaries[name] = summary
          vue = json.loads(Path('/tmp/call-center-vitest.json').read_text())
          assert vue['numPassedTests'] == vue['numTotalTests'] > 0
          assert vue['numFailedTests'] == vue['numPendingTests'] == 0
          evidence = {
              'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'source_matrix_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'rails': summaries, 'vue': {key: vue[key] for key in ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests']},
              'chrome': stats, 'matrix': matrix,
              'stages_0_2_complete': False, 'external_homologation': False,
              'screenshots': {str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                              for path in sorted(Path('.codex/call-center-native-e2e').rglob('*.png'))},
          }
          Path('/tmp/call-center-acceptance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Preserve source identity
        if: always()
        run: git diff --exit-code && git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: call-center-native-${{ github.sha }}
          path: |
            /tmp/call-center-*.json
            /tmp/call-center-*.txt
            /tmp/call-center-schema.rb
            .codex/call-center-native-e2e
          if-no-files-found: error
          retention-days: 7
