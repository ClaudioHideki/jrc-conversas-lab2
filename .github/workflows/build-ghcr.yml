name: JRC Conversas - build e GHCR candidato por SHA

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a imagem aprovada no GHCR
        type: boolean
        default: false
      backoffice_candidate:
        description: Validar a candidata Backoffice com Rails e Sidekiq isolados
        type: boolean
        default: false
      validation_run_id:
        description: Run de integracao bem-sucedido no mesmo SHA (Backoffice ou Projetos e Portal)
        type: string
        required: false
      source_sha:
        description: SHA completo aprovado do codigo-fonte (40 caracteres)
        type: string
        required: true
      projects_validation_run_id:
        description: Run de projects-portal-candidate.yml no mesmo SHA e branch para release consolidada
        type: string
        required: false
      base_sha:
        description: SHA base da integracao para validar tambem commits de correcao (opcional)
        type: string
        required: false
      component:
        description: Construir somente o componente afetado (Cadastro Mestre usa app)
        type: choice
        options: [app, nico-runtime, flows-sandbox]
        default: app
        required: true

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  precimech-regression:
    if: inputs.component == 'app'
    uses: ./.github/workflows/precimech-hotfix-tests.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  build-and-push:
    needs: precimech-regression
    if: ${{ !cancelled() && (inputs.component != 'app' || needs.precimech-regression.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: ghcr-jrc-conversas-${{ inputs.component }}
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      COMPONENT: ${{ inputs.component }}
      BACKOFFICE_CANDIDATE: ${{ inputs.backoffice_candidate }}
      BUNDLE_FROZEN: 'true'
      TZ: UTC

    steps:
      - name: Validar SHA antes do checkout
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: Publicar somente no namespace deste repositorio
        run: |
          repository_image=${GITHUB_REPOSITORY,,}
          case "$COMPONENT" in
            app) image="$repository_image" ;;
            nico-runtime|flows-sandbox) image="$repository_image-$COMPONENT" ;;
            *) exit 1 ;;
          esac
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Exigir gate nativo na candidata consolidada
        if: (github.ref_name == 'main' || github.ref_name == 'codex/release-integrada-specs-20261102' || github.ref_name == 'codex/lab2-integral-20261102' || github.ref_name == 'codex/shared-inbox-history-20261104' || startsWith(github.ref_name, 'codex/ura-padrao-lab2-') || startsWith(github.ref_name, 'codex/consolidacao-')) && inputs.component == 'app'
        run: test "$BACKOFFICE_CANDIDATE" = true

      - name: Exigir integracao de Projetos e Portal no SHA exato
        if: startsWith(github.ref_name, 'codex/projetos-portal-') && inputs.component == 'app'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          python3 - <<'PYTHON'
          import json, os, urllib.request
          run_id = os.environ['VALIDATION_RUN_ID']
          assert run_id.isdecimal(), 'Integration validation run ID required'
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Validation SHA mismatch'
          assert run['head_branch'] == os.environ['GITHUB_REF_NAME'], 'Validation branch mismatch'
          assert run['path'] == '.github/workflows/projects-portal-candidate.yml', 'Unexpected integration workflow'
          assert run['conclusion'] == 'success', 'Integration validation has not passed'
          print('Exact candidate integration confirmed:', run['html_url'])
          PYTHON

      - name: Exigir Projetos e Portal tambem na release consolidada
        if: (github.ref_name == 'main' || startsWith(github.ref_name, 'codex/consolidacao-')) && inputs.component == 'app'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RUN_ID: ${{ inputs.projects_validation_run_id }}
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          python3 - <<'PYTHON'
          import json, os, urllib.request
          run_id = os.environ['VALIDATION_RUN_ID']
          assert run_id.isdecimal(), 'Projects and Portal validation run ID required'
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Projects validation SHA mismatch'
          assert run['head_branch'] == os.environ['GITHUB_REF_NAME'], 'Projects validation branch mismatch'
          assert run['path'] == '.github/workflows/projects-portal-candidate.yml', 'Unexpected Projects workflow'
          assert run['conclusion'] == 'success', 'Projects and Portal validation has not passed'
          print('Exact consolidated Projects and Portal integration confirmed:', run['html_url'])
          PYTHON

      - name: Baixar a revisao exata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirmar identidade e alteracoes do componente
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ -z "$BASE_SHA" ]; then BASE_SHA=$(git rev-parse "$SOURCE_SHA^"); fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          case "$COMPONENT" in
            app) paths=(app config db lib enterprise public Gemfile Gemfile.lock package.json pnpm-lock.yaml docker/Dockerfile docker/entrypoints) ;;
            nico-runtime) paths=(services/nico-runtime docker/nico-runtime.Dockerfile) ;;
            flows-sandbox) paths=(services/flows-sandbox) ;;
            *) exit 1 ;;
          esac
          if git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- "${paths[@]}"; then
            echo 'Componente nao afetado; nao gerar uma imagem/tag nova.' >&2
            exit 1
          fi

      - name: Configurar Node declarado
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Configurar pnpm declarado
        if: inputs.component == 'app'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Verificar headers PostgreSQL do runner para os gates Ruby
        if: inputs.component == 'app'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mirror=''
          for candidate in https://archive.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            if curl --fail --silent --max-time 10 "$candidate/dists/noble/InRelease" -o /dev/null; then
              mirror="$candidate"
              break
            fi
          done
          test -n "$mirror"
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -i -E "s#https?://(azure[.]archive|archive|security)[.]ubuntu[.]com/ubuntu/?#$mirror/#g" "$source"
            fi
          done
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libpq-dev libvips libvips-dev
          if [ "$BACKOFFICE_CANDIDATE" = true ]; then
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends imagemagick poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
          fi

      - name: Configurar Ruby e Bundler declarados
        if: inputs.component == 'app'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: 2.5.16
          bundler-cache: true

      - name: Instalar JavaScript sem alterar lockfile
        if: inputs.component == 'app'
        run: pnpm install --frozen-lockfile

      - name: Sintaxe dos fontes alterados e timestamps de migrations
        if: inputs.component == 'app'
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$SOURCE_SHA" -- '*.rb' | while IFS= read -r file; do ruby -c "$file"; done
          node script/validate_changed_source.mjs "$BASE_SHA"

      - name: Gates isolados do Cadastro Mestre e modulos preservados
        if: inputs.component == 'app'
        run: |
          ruby test/jrc_customers/identity_pure_test.rb
          ruby test/jrc_customers/company_link_decision_test.rb
          bundle exec ruby -Itest -e 'Dir["test/jrc_relationship/*_test.rb", "test/jrc_operations/*_test.rb"].each { |file| require_relative file }'
          node --test test/jrc_customers/*.test.mjs test/jrc_operations/*test.mjs test/jrc_consolidation/commercial_ui.test.mjs

      - name: Vitest dos modulos afetados e SIP/WebRTC preservado
        if: inputs.component == 'app'
        run: >-
          pnpm exec vitest run
          app/javascript/dashboard/routes/dashboard/serviceDesk
          app/javascript/dashboard/routes/dashboard/jrcOperations
          app/javascript/dashboard/routes/dashboard/crm
          app/javascript/dashboard/routes/dashboard/jrcCustomers
          app/javascript/dashboard/routes/dashboard/jrcCampaigns/specs
          app/javascript/dashboard/routes/dashboard/webphone
          app/javascript/dashboard/routes/dashboard/jrcRelationship
          app/javascript/dashboard/components-next/sidebar/specs
          app/javascript/dashboard/components-next/layout/specs
          app/javascript/dashboard/components-next/NewConversation
          app/javascript/dashboard/components-next/Conversation/ConversationHome/specs
          app/javascript/dashboard/routes/dashboard/contacts/pages/spec
          app/javascript/dashboard/routes/dashboard/videoConference
          app/javascript/dashboard/helper/specs/inbox.spec.js
          app/javascript/dashboard/helper/specs/videoConference.spec.js
          --maxWorkers=2 --no-file-parallelism

      - name: Lint direcionado do Cadastro Mestre e Pedido
        if: inputs.component == 'app'
        run: >-
          pnpm exec eslint --ext .js,.vue
          app/javascript/dashboard/routes/dashboard/jrcCustomers
          app/javascript/dashboard/api/jrcCustomers.js
          app/javascript/dashboard/api/crm/commercialCycle.js
          app/javascript/dashboard/routes/dashboard/crm/helpers/commercialTerms.js
          app/javascript/dashboard/routes/dashboard/crm/views/orders

      - name: Lint dos fontes alterados de Relacionamento e badges
        if: inputs.component == 'app'
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$SOURCE_SHA" -- app/javascript | grep -E '\.(js|vue)$' | grep -E '(/jrcRelationship/|/api/jrcRelationship.js$|/components-next/sidebar/)' | grep -v '/sidebar/Sidebar.vue$')
          if [ "${#files[@]}" -gt 0 ]; then pnpm exec eslint "${files[@]}"; fi

      - name: Gates NICO sem reconstruir a aplicacao
        if: inputs.component == 'nico-runtime'
        working-directory: services/nico-runtime
        run: npm ci && npm test --if-present && npm run build

      - name: Gates Flows sem reconstruir a aplicacao
        if: inputs.component == 'flows-sandbox'
        working-directory: services/flows-sandbox
        run: npm ci --ignore-scripts && npm test

      - name: Confirmar que os gates nao alteraram o codigo aprovado
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:98cc6a3fc46220d00f8224ae483f3274fc874e9be8d7dd1e2e2c5481209228b5

      - name: Construir somente a imagem selecionada (inclui build frontend)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.component == 'flows-sandbox' && './services/flows-sandbox' || '.' }}
          file: ${{ inputs.component == 'app' && './docker/Dockerfile' || inputs.component == 'nico-runtime' && './docker/nico-runtime.Dockerfile' || './services/flows-sandbox/Dockerfile' }}
          platforms: linux/amd64
          load: true
          push: false
          build-args: GIT_SHA=${{ inputs.source_sha }}
          tags: ghcr.io/${{ env.IMAGE }}:sha-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,scope=${{ inputs.component }},mode=max
          provenance: false

      - name: Verificar SHA interno, label e plataforma antes de publicar
        run: |
          image="ghcr.io/$IMAGE:sha-$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          revision_path=/app/.git_sha
          if [ "$COMPONENT" = flows-sandbox ]; then revision_path=/srv/.git_sha; fi
          test "$(docker run --rm --network none --entrypoint cat "$image" "$revision_path")" = "$SOURCE_SHA"

      - name: Validar conteudo do produto, migrations e bibliotecas nativas
        if: inputs.component == 'app'
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=ACMR', os.environ['BASE_SHA'], os.environ['SOURCE_SHA']], text=True).splitlines()
          paths = [p for p in paths if p.startswith(('app/', 'config/', 'db/', 'lib/', 'enterprise/', 'public/')) and '/spec/' not in p and '/specs/' not in p and not p.endswith(('.spec.js', '.spec.vue'))]
          migrations = [
              'db/migrate/20261004170000_complete_jrc_customer_master_company_profile.rb',
              'db/migrate/20261004183000_strengthen_sales_order_origin_and_audit.rb',
              'db/migrate/20261004234000_create_jrc_operations_routing_and_sla.rb',
              'db/migrate/20261005180000_create_jrc_relationship.rb',
              'db/migrate/20261005190000_allow_direct_customer_proposals.rb',
              'db/migrate/20261005200000_extend_relationship_operations.rb',
              'db/migrate/20261005210000_add_relationship_playbook_conditions.rb',
              'db/migrate/20261005220000_extend_commercial_operational_configuration.rb',
              'db/migrate/20261111150000_create_whatsapp_retry_attempts.rb',
          ]
          if os.environ.get('BACKOFFICE_CANDIDATE') == 'true':
              migrations += ['db/migrate/20261101190000_create_backoffice_document_versions.rb',
                             'db/migrate/20261101200000_version_backoffice_fulfillment_flow.rb']
          files = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in set(paths + migrations)}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-files.json').write_text(json.dumps(files))
          PYTHON
          docker run --rm -i --network none --read-only --entrypoint bundle --mount "type=bind,source=$RUNNER_TEMP/candidate-files.json,target=/candidate-files.json,readonly" "ghcr.io/$IMAGE:sha-$SOURCE_SHA" exec ruby - <<'RUBY'
          require 'json'
          require 'digest'
          expected = JSON.parse(File.read('/candidate-files.json'))
          expected.each do |path, sha|
            raise "Candidate file missing or changed: #{path}" unless File.file?(path) && Digest::SHA256.file(path).hexdigest == sha
          end
          %w[verify-image.rb verify-and-save.ps1 finish-image-report.cjs].each do |helper|
            raise "Local auxiliary entered image: #{helper}" unless Dir.glob("/app/**/#{helper}").empty?
          end
          require 'grpc'
          require 'pg'
          require 'nokogiri'
          puts JSON.generate(verified_product_files: expected.size, migrations: expected.keys.count { |path| path.start_with?('db/migrate/') }, grpc: GRPC::VERSION, pg: PG::VERSION, nokogiri: Nokogiri::VERSION)
          RUBY

      - name: Confirmar a validacao nativa da candidata no mesmo SHA
        if: inputs.backoffice_candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          case "$GITHUB_REF_NAME" in
            main|codex/crm-backoffice-servicedesk-visual-20261101|codex/release-integrada-specs-20261102|codex/lab2-integral-20261102|codex/shared-inbox-history-20261104|codex/ura-padrao-lab2-*|codex/consolidacao-*) ;;
            *) echo 'Branch candidata nao autorizada para este gate' >&2; exit 1 ;;
          esac
          test "$COMPONENT" = app
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          if [ "$PUBLISH" = true ]; then
            python3 - <<'PYTHON'
          import json, os, urllib.request
          run_id = os.environ['VALIDATION_RUN_ID']
          assert run_id.isdecimal(), 'Native validation run ID required'
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Validation source SHA mismatch'
          assert run['head_branch'] == os.environ['GITHUB_REF_NAME'], 'Validation branch mismatch'
          assert run['path'] == '.github/workflows/backoffice-flow.yml', 'Unexpected validation workflow'
          assert run['conclusion'] == 'success', 'Native validation has not passed'
          print('Native validation confirmed for the exact candidate SHA:', run['html_url'])
          PYTHON
          fi

      - name: Inicializar Rails e Sidekiq da mesma imagem e processar OCR real isolado
        if: inputs.backoffice_candidate
        run: bash script/smoke_backoffice_candidate.sh

      - name: Guardar diagnosticos do runtime candidato
        if: always() && inputs.backoffice_candidate
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-candidate-runtime-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jrc-bo-candidate-*.log
          if-no-files-found: ignore

      - name: Autenticar GHCR para leitura da imagem anterior no smoke isolado
        if: inputs.component == 'app'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke do artefato exato com app, worker e transporte falso
        if: inputs.component == 'app'
        run: |
          docker run --rm --network none --entrypoint test "ghcr.io/$IMAGE:sha-$SOURCE_SHA" ! -e /app/script/precimech_hotfix
          bash script/precimech_hotfix/candidate_smoke.sh "ghcr.io/$IMAGE:sha-$SOURCE_SHA"
          git diff --exit-code

      - name: Autenticar no GHCR somente para publicacao autorizada
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirmar ausencia autenticada da tag imediatamente antes do push
        if: inputs.publish
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 script/ghcr_tag_absent.py "$IMAGE" "$SOURCE_SHA"

      - name: Publicar exclusivamente a tag imutavel do SHA aprovado
        if: inputs.publish
        run: docker push "ghcr.io/$IMAGE:sha-$SOURCE_SHA"

      - name: Verificar imagem publicada pelo digest e pela identidade interna
        if: inputs.publish
        run: |
          image="ghcr.io/$IMAGE:sha-$SOURCE_SHA"
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/amd64 "ghcr.io/$IMAGE@$digest"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/$IMAGE@$digest")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "ghcr.io/$IMAGE@$digest")" = linux/amd64
          revision_path=/app/.git_sha
          if [ "$COMPONENT" = flows-sandbox ]; then revision_path=/srv/.git_sha; fi
          test "$(docker run --rm --network none --entrypoint cat "ghcr.io/$IMAGE@$digest" "$revision_path")" = "$SOURCE_SHA"
          docker buildx imagetools inspect "ghcr.io/$IMAGE@$digest" --raw > "$RUNNER_TEMP/manifest.json"
          compressed_bytes=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(sum(x["size"] for x in m["layers"]))' "$RUNNER_TEMP/manifest.json")
          {
            echo "Imagem: $image"
            echo "Digest: $digest"
            echo "IMAGE ID: $(docker image inspect --format '{{.Id}}' "ghcr.io/$IMAGE@$digest")"
            echo "Tamanho local: $(docker image inspect --format '{{.Size}}' "ghcr.io/$IMAGE@$digest") bytes"
            echo "SHA interno e label: $SOURCE_SHA"
            echo 'Plataforma: linux/amd64'
            echo "Camadas comprimidas: $compressed_bytes bytes (nao inclui config/manifest)"
            echo "Criacao: $(docker image inspect --format '{{.Created}}' "ghcr.io/$IMAGE@$digest")"
            echo "Verificacao UTC: $(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Repetir smoke na imagem publicada por digest
        if: inputs.publish && inputs.component == 'app'
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/$IMAGE:sha-$SOURCE_SHA" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash script/precimech_hotfix/candidate_smoke.sh "ghcr.io/$IMAGE@$digest"
          git diff --exit-code
