name: Candidato Cadastro Mestre - build e GHCR por SHA

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a imagem aprovada no GHCR
        type: boolean
        default: false
      source_sha:
        description: SHA completo aprovado do codigo-fonte (40 caracteres)
        type: string
        required: true
      base_sha:
        description: SHA base da integracao para validar tambem commits de correcao (opcional)
        type: string
        required: false
      component:
        description: Construir somente o componente afetado (Cadastro Mestre usa app)
        type: choice
        options: [app, nico-runtime, flows-sandbox]
        default: app
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: ghcr-jrc-conversas-${{ inputs.component }}
      cancel-in-progress: false
    services:
      postgres:
        image: ${{ inputs.component == 'app' && 'pgvector/pgvector:pg16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: ${{ inputs.component == 'app' && 'redis:7-alpine' || '' }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      COMPONENT: ${{ inputs.component }}
      IMAGE: ${{ inputs.component == 'app' && 'claudiohideki/jrc-conversas-lab2' || format('claudiohideki/jrc-conversas-nico-v12-2-7-comercial-integrado-{0}', inputs.component) }}
      BUNDLE_FROZEN: 'true'
      TZ: UTC

    steps:
      - name: Validar SHA antes do checkout
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: Baixar a revisao exata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirmar identidade e alteracoes do componente
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ -z "$BASE_SHA" ]; then BASE_SHA=$(git rev-parse "$SOURCE_SHA^"); fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          case "$COMPONENT" in
            app) paths=(app config db lib enterprise public Gemfile Gemfile.lock package.json pnpm-lock.yaml docker/Dockerfile docker/entrypoints) ;;
            nico-runtime) paths=(services/nico-runtime docker/nico-runtime.Dockerfile) ;;
            flows-sandbox) paths=(services/flows-sandbox) ;;
            *) exit 1 ;;
          esac
          if git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- "${paths[@]}"; then
            echo 'Componente nao afetado; nao gerar uma imagem/tag nova.' >&2
            exit 1
          fi

      - name: Configurar Node declarado
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Configurar pnpm declarado
        if: inputs.component == 'app'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Instalar dependencias de sistema dos gates Ruby
        if: inputs.component == 'app'
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libvips libvips-dev

      - name: Configurar Ruby e Bundler declarados
        if: inputs.component == 'app'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: 2.5.16
          bundler-cache: true

      - name: Instalar JavaScript sem alterar lockfile
        if: inputs.component == 'app'
        run: pnpm install --frozen-lockfile

      - name: Sintaxe dos fontes alterados e timestamps de migrations
        if: inputs.component == 'app'
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$SOURCE_SHA" -- '*.rb' | while IFS= read -r file; do ruby -c "$file"; done
          node script/validate_changed_source.mjs "$BASE_SHA"

      - name: PostgreSQL isolado, migrations e RSpec CRM Cadastro Mestre
        if: inputs.component == 'app'
        env:
          RAILS_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_DATABASE: jrc_pedidos_ci_test
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: ci-test-only
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY_BASE: ci-test-placeholder-not-a-production-secret
        run: |
          cp db/schema.rb "$RUNNER_TEMP/approved-schema.rb"
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rails runner 'require Rails.root.join("db/migrate/20261004183000_strengthen_sales_order_origin_and_audit"); migration = StrengthenSalesOrderOriginAndAudit.new; migration.migrate(:down); raise "down failed" if ActiveRecord::Base.connection.column_exists?(:jrc_crm_sales_orders, :order_origin); migration.migrate(:up); raise "up failed" unless ActiveRecord::Base.connection.column_exists?(:jrc_crm_sales_orders, :order_origin)'
          bundle exec rspec spec/requests/api/v1/accounts/crm/sales_order_link_integrity_spec.rb spec/requests/api/v1/accounts/crm/consolidated_commercial_protection_spec.rb spec/requests/api/v1/accounts/crm/commercial_flow_spec.rb spec/requests/api/v1/accounts/crm/goals_actionable_insights_spec.rb spec/services/jrc_crm/nexora_end_to_end_spec.rb spec/services/jrc_crm/consolidated_financial_guards_spec.rb spec/models/jrc_customers/company_spec.rb spec/models/jrc_customers/taxonomy_spec.rb spec/services/jrc_customers/master_services_spec.rb
          bundle exec rails runner 'route = Rails.application.routes.recognize_path("/api/v1/accounts/1/crm/contracts/order_options", method: :get); raise "contract route mismatch" unless route[:action] == "order_options"'
          cp "$RUNNER_TEMP/approved-schema.rb" db/schema.rb

      - name: Gates isolados do Cadastro Mestre e modulos preservados
        if: inputs.component == 'app'
        run: |
          ruby test/jrc_customers/identity_pure_test.rb
          ruby test/jrc_customers/company_link_decision_test.rb
          node --test test/jrc_customers/*.test.mjs test/jrc_operations/*test.mjs test/jrc_consolidation/commercial_ui.test.mjs

      - name: Vitest dos modulos afetados e SIP/WebRTC preservado
        if: inputs.component == 'app'
        run: >-
          pnpm exec vitest run
          app/javascript/dashboard/routes/dashboard/serviceDesk
          app/javascript/dashboard/routes/dashboard/jrcOperations
          app/javascript/dashboard/routes/dashboard/crm
          app/javascript/dashboard/routes/dashboard/jrcCustomers
          app/javascript/dashboard/routes/dashboard/webphone
          --maxWorkers=2 --no-file-parallelism

      - name: Lint direcionado do Cadastro Mestre e Pedido
        if: inputs.component == 'app'
        run: >-
          pnpm exec eslint --ext .js,.vue
          app/javascript/dashboard/routes/dashboard/jrcCustomers
          app/javascript/dashboard/api/jrcCustomers.js
          app/javascript/dashboard/api/crm/commercialCycle.js
          app/javascript/dashboard/routes/dashboard/crm/helpers/commercialTerms.js
          app/javascript/dashboard/routes/dashboard/crm/views/orders

      - name: Gates NICO sem reconstruir a aplicacao
        if: inputs.component == 'nico-runtime'
        working-directory: services/nico-runtime
        run: npm ci && npm test --if-present && npm run build

      - name: Gates Flows sem reconstruir a aplicacao
        if: inputs.component == 'flows-sandbox'
        working-directory: services/flows-sandbox
        run: npm ci --ignore-scripts && npm test

      - name: Confirmar que os gates nao alteraram o codigo aprovado
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir somente a imagem selecionada (inclui build frontend)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.component == 'flows-sandbox' && './services/flows-sandbox' || '.' }}
          file: ${{ inputs.component == 'app' && './docker/Dockerfile' || inputs.component == 'nico-runtime' && './docker/nico-runtime.Dockerfile' || './services/flows-sandbox/Dockerfile' }}
          platforms: linux/amd64
          load: true
          push: false
          build-args: GIT_SHA=${{ inputs.source_sha }}
          tags: ghcr.io/${{ env.IMAGE }}:sha-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,scope=${{ inputs.component }},mode=max
          provenance: false

      - name: Verificar SHA interno, label e plataforma antes de publicar
        run: |
          image="ghcr.io/$IMAGE:sha-$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          revision_path=/app/.git_sha
          if [ "$COMPONENT" = flows-sandbox ]; then revision_path=/srv/.git_sha; fi
          test "$(docker run --rm --network none --entrypoint cat "$image" "$revision_path")" = "$SOURCE_SHA"

      - name: Autenticar no GHCR somente para publicacao autorizada
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirmar ausencia autenticada da tag imediatamente antes do push
        if: inputs.publish
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 script/ghcr_tag_absent.py "$IMAGE" "$SOURCE_SHA"

      - name: Publicar exclusivamente a tag imutavel do SHA aprovado
        if: inputs.publish
        run: docker push "ghcr.io/$IMAGE:sha-$SOURCE_SHA"

      - name: Verificar imagem publicada pelo digest e pela identidade interna
        if: inputs.publish
        run: |
          image="ghcr.io/$IMAGE:sha-$SOURCE_SHA"
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/amd64 "ghcr.io/$IMAGE@$digest"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/$IMAGE@$digest")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "ghcr.io/$IMAGE@$digest")" = linux/amd64
          revision_path=/app/.git_sha
          if [ "$COMPONENT" = flows-sandbox ]; then revision_path=/srv/.git_sha; fi
          test "$(docker run --rm --network none --entrypoint cat "ghcr.io/$IMAGE@$digest" "$revision_path")" = "$SOURCE_SHA"
          docker buildx imagetools inspect "ghcr.io/$IMAGE@$digest" --raw > "$RUNNER_TEMP/manifest.json"
          compressed_bytes=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(sum(x["size"] for x in m["layers"]))' "$RUNNER_TEMP/manifest.json")
          {
            echo "Imagem: $image"
            echo "Digest: $digest"
            echo "SHA interno e label: $SOURCE_SHA"
            echo 'Plataforma: linux/amd64'
            echo "Camadas comprimidas: $compressed_bytes bytes (nao inclui config/manifest)"
            echo "Criacao: $(docker image inspect --format '{{.Created}}' "ghcr.io/$IMAGE@$digest")"
            echo "Verificacao UTC: $(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"
