name: Projetos e Portal - integracao isolada

on:
  push:
    branches: ['main', 'codex/projetos-portal-*', 'codex/consolidacao-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projects-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rails:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['6379:6379']
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DATABASE: jrc_portal_integrado_20261109_test
      JRC_SD_CONCURRENCY: '1'
      DB_POOL_SIZE: '10'
      REDIS_URL: redis://127.0.0.1:6379/15
      FRONTEND_URL: https://host.example.test
      SECRET_KEY_BASE: isolated-voice-v4-ci-not-a-production-secret
      BUNDLE_FROZEN: 'true'
      SCHEMA: /tmp/projects-portal-schema.rb
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dependencias Rails
        run: |
          mirror=''
          for candidate in https://archive.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            if curl --fail --silent --max-time 10 "$candidate/dists/noble/InRelease" -o /dev/null; then
              mirror="$candidate"
              break
            fi
          done
          test -n "$mirror"
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -i -E "s#https?://(azure[.]archive|archive|security)[.]ubuntu[.]com/ubuntu/?#$mirror/#g" "$source"
            fi
          done
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::https::Timeout=30 -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends libpq-dev libvips libvips-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: 2.5.16
          bundler-cache: true
      - name: Schema somente no banco descartavel
        run: |
          test "$RAILS_ENV" = test
          test "$POSTGRES_HOST" = 127.0.0.1
          test "$POSTGRES_DATABASE" = jrc_portal_integrado_20261109_test
          SCHEMA=db/schema.rb bundle exec rails db:create db:schema:load
          bundle exec rails db:migrate
          bundle exec rails db:migrate:down VERSION=20261109160000
          bundle exec rails db:migrate:up VERSION=20261109160000
      - name: Regressao autenticada do endpoint de estabelecimentos
        run: bundle exec rspec spec/requests/api/v1/accounts/jrc_service_desk/establishments_spec.rb
      - name: RSpec Projetos, Portal, identidade, lojas e regressao de voz
        run: |
          bundle exec rspec spec/requests/api/v1/accounts/jrc_operations \
            spec/requests/api/v1/accounts/jrc_service_desk \
            spec/requests/requester_portal spec/services/jrc_service_desk \
            spec/services/jrc_projects spec/models/jrc_service_desk \
            spec/services/jrc_contact_center spec/models/jrc_contact_center \
            spec/requests/api/v1/accounts/jrc_contact_center \
            --exclude-pattern '**/*concurrency_spec.rb' \
            --format progress --format json --out /tmp/projects-portal-rspec.json
      - name: Concorrencia com fixtures commitadas apos a suite transacional
        run: |
          # Committed concurrency fixtures must not contaminate global-count assertions above.
          mapfile -t specs < <(git ls-files spec/requests/api/v1/accounts/jrc_operations spec/requests/api/v1/accounts/jrc_service_desk spec/services/jrc_service_desk spec/services/jrc_contact_center | grep 'concurrency_spec.rb$')
          bundle exec rspec "${specs[@]}" --format progress --format json --out /tmp/projects-portal-concurrency.json
      - name: Concorrencia SD no banco dedicado exigido pelos guards
        env:
          POSTGRES_DATABASE: jrc_sd_integrated_concurrency_20261023_test
          JRC_SD_INTEGRATED_CONCURRENCY: '1'
        run: |
          SCHEMA=db/schema.rb bundle exec rails db:create db:schema:load
          bundle exec rails db:migrate
          bundle exec rspec spec/services/jrc_service_desk/closure_revision_concurrency_spec.rb spec/services/jrc_service_desk/integrated_assignment_concurrency_spec.rb
      - name: Comentarios ricos concorrentes no banco dedicado exigido pelo guard
        env:
          POSTGRES_DATABASE: jrc_four_fronts_concurrency_20261026_test
          JRC_PROJECT_COMMENT_CONCURRENCY: '1'
        run: |
          SCHEMA=db/schema.rb bundle exec rails db:create db:schema:load
          bundle exec rails db:migrate
          bundle exec rspec spec/requests/api/v1/accounts/jrc_operations/rich_comments_concurrency_spec.rb
      - name: Baseline revisado do produto ou da extensao
        run: |
          baseline=35976b08077035ee79843b07ad02c0389d002f09
          if [ -f deploy/jrc/EXTENSION-REFERENCE.json ]; then
            baseline=$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("extensionBaselineSha")' deploy/jrc/EXTENSION-REFERENCE.json)
          fi
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$baseline"
          git merge-base --is-ancestor "$baseline" HEAD
          echo "REVIEW_BASE_SHA=$baseline" >> "$GITHUB_ENV"
      - name: Sintaxe Ruby do incremento
        run: |
          git diff --name-only --diff-filter=ACMR "$REVIEW_BASE_SHA" HEAD -- '*.rb' | xargs -r -n 1 ruby -c
      - name: RuboCop Lint dos fontes Ruby alterados
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$REVIEW_BASE_SHA" HEAD -- '*.rb')
          bundle exec rubocop --force-exclusion --only Lint --format simple "${files[@]}"
      - name: Preservar guards existentes de custodia ao carregar o schema
        run: >-
          bundle exec rspec spec/services/jrc_migrations/media_protocol_spec.rb
          --example 'reserves an immutable new storage key'
          --example 'rejects a reserved SQL row'
          --format progress --format json --out /tmp/projects-portal-schema-regression.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Dependencias JavaScript sem alterar lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint dos fontes JavaScript alterados
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$REVIEW_BASE_SHA" HEAD -- app/javascript | grep -E '\.(js|vue)$')
          if [ "${#files[@]}" -gt 0 ]; then pnpm exec eslint "${files[@]}"; fi
      - name: Vitest voz, inbox, chamadas e acoes globais
        run: >-
          pnpm exec vitest run
          app/javascript/dashboard/routes/dashboard/jrcProjects
          app/javascript/dashboard/routes/dashboard/jrcOperations
          app/javascript/dashboard/routes/dashboard/serviceDesk
          app/javascript/portal/requester
          app/javascript/widget/components/spec/ServiceDeskPortal.spec.js
          app/javascript/dashboard/routes/dashboard/webphone
          app/javascript/dashboard/routes/dashboard/inbox
          app/javascript/dashboard/routes/dashboard/jrcContactCenter
          app/javascript/dashboard/components-next/layout/specs
          app/javascript/dashboard/__tests__/voiceV4Locale.spec.js
          --maxWorkers=2 --minWorkers=1 --no-file-parallelism
          --reporter=default --reporter=json --outputFile=/tmp/projects-portal-vitest.json
      - name: Build frontend real
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bundle exec vite build
      - name: Dependencias do laboratorio E2E isolado
        run: pnpm --dir tests/playwright install --frozen-lockfile --ignore-scripts
      - name: Chromium para o laboratorio sintetico
        run: node tests/playwright/node_modules/playwright/cli.js install --with-deps chromium
      - name: E2E Voz V4 em componentes reais e adaptadores sinteticos
        run: node tests/playwright/node_modules/@playwright/test/cli.js test --config tests/playwright/voice-v4.config.ts
      - name: Integridade do checkout
        if: always()
        run: git diff --exit-code && git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-portal-validation-${{ github.sha }}
          path: |
            /tmp/projects-portal-rspec.json
            /tmp/projects-portal-concurrency.json
            /tmp/projects-portal-vitest.json
            /tmp/projects-portal-schema.rb
            /tmp/projects-portal-schema-regression.json
            .codex/voice-v4-e2e
          if-no-files-found: ignore
