en:
  jrc_sd_initialization:
    title: "Service Desk - human initialization"
    separation: "Structural authority does not grant ticket access. No membership is created for the JRC employee."
    manual: "This explicit action creates an active operator and unit and grants scope to the selected client member in a single audited transaction. It does not enable flags or change roles."
    back: "Back to Account"
    receipt: "Read initialization receipt"
    search: "Search existing client member (up to 50 results)"
    existing_user: "Only confirmed client users already linked to this Account are eligible. No user is created here."
    operator: "Operator company"
    unit: "Unit"
    code: "Code"
    name: "Name"
    recipient: "First client AccountUser"
    reason: "Authorization reference / reason"
    confirmation: "I confirm the Account, operator, unit and selected recipient. I authorize this initial scope grant."
    submit: "Create structure and grant the selected first scope"
    not_empty: "The structure is not empty. No automatic merge, reset or additional grant is allowed by initialization."
    invalid: "Initialization was not confirmed. Review the input, authorization, current structure and request key. No success is being claimed."
    reloaded: "Receipt and current records were read again from the backend. Refresh repeats the read, not the grant."
    author: "JRC employee User ID"
    audit: "Audit"
    active: "Active"
    changed: "The current structure differs from the initial receipt. The audit preserves the original action."
pt_BR:
  jrc_sd_initialization:
    title: "Service Desk - inicialização humana"
    separation: "Autoridade estrutural não concede acesso a chamados. Nenhum vínculo é criado para o funcionário JRC."
    manual: "Esta ação explícita cria operadora e unidade ativas e concede escopo ao membro cliente selecionado, em uma transação auditada. Não liga flags nem altera papéis."
    back: "Voltar à Account"
    receipt: "Consultar recibo da inicialização"
    search: "Pesquisar membro cliente existente (até 50 resultados)"
    existing_user: "Somente usuários clientes confirmados já vinculados a esta Account são elegíveis. Nenhum usuário é criado aqui."
    operator: "Empresa Operadora"
    unit: "Unidade"
    code: "Código"
    name: "Nome"
    recipient: "Primeiro AccountUser cliente"
    reason: "Referência da autorização / motivo"
    confirmation: "Confirmo a Account, operadora, unidade e destinatário selecionado. Autorizo este primeiro vínculo operacional."
    submit: "Criar estrutura e conceder primeiro escopo selecionado"
    not_empty: "A estrutura não está vazia. A inicialização não faz mesclagem, limpeza ou concessão adicional automática."
    invalid: "A inicialização não foi confirmada. Confira dados, autorização, estrutura atual e chave da tentativa. Nenhum sucesso foi declarado."
    reloaded: "O recibo e os registros atuais foram relidos do backend. F5 repete a consulta, não a concessão."
    author: "ID User do funcionário JRC"
    audit: "Auditoria"
    active: "Ativo"
    changed: "A estrutura atual difere do recibo inicial. A auditoria preserva a ação original."
