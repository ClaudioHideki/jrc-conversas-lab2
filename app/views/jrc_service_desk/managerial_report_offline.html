<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Service Desk</title>
<style>
:root{
  color-scheme:light;--bg:#edf4ff;--panel:#fff;--subtle:#f2f7fe;--text:#17283d;--muted:#465c76;
  --line:#cbd9ec;--accent:#1259b0;--teal:#08776a;--violet:#5f43a2;--amber:#925105;--red:#ab2851;
}
:root.dark{
  color-scheme:dark;--bg:#101927;--panel:#18263a;--subtle:#1f3049;--text:#e8eff8;--muted:#b6c7dc;
  --line:#3e536d;--accent:#90c4ff;--teal:#76dfc3;--violet:#cfbaff;--amber:#ffd087;--red:#ffa8bd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
main{max-width:1500px;margin:auto;padding:clamp(.75rem,3vw,2rem)}
header,.toolbar{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center}
header{
  margin-bottom:1rem;padding:clamp(1rem,3vw,1.75rem);border-radius:1rem;
  background:linear-gradient(110deg,#09264c,#164b9e 75%,#155e97);color:#fff;
}
header h1{margin:0;font-size:clamp(1.4rem,3vw,1.9rem)}
header button{border-color:#a6c0e0;background:#183d70;color:inherit}
header button:focus-visible{outline-color:#fff}
h2,h3{margin:0 0 .75rem}h2{font-size:1.25rem}h3{font-size:1rem}
section,details{margin:0 0 1rem;padding:clamp(.85rem,2vw,1.25rem);border:1px solid var(--line);border-radius:1rem;background:var(--panel)}
summary{cursor:pointer;font-weight:650;color:var(--accent)}
.filters,.tiles,.charts{display:grid;gap:.75rem}
.filters{grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr))}
label{display:grid;gap:.35rem;min-width:0;overflow-wrap:anywhere}
input,select,button{border:1px solid var(--line);border-radius:.45rem;padding:.5rem .65rem;font:inherit;background:var(--panel);color:var(--text)}
input,select{width:100%;min-width:0;max-width:100%}
button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{grid-template-columns:minmax(0,1fr)}
@media(min-width:28rem){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:42rem){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:56rem){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:84rem){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{
  --tone:var(--accent);
  display:flex;flex-direction:column;justify-content:space-between;gap:.35rem;min-height:5.65rem;
  padding:.8rem;border:1px solid var(--line);border-inline-start:.28rem solid var(--tone);border-radius:.65rem;
  background:var(--subtle);background:color-mix(in srgb,var(--tone) 9%,var(--panel));
  overflow-wrap:anywhere;
}
.tile strong{font-size:clamp(1.25rem,2vw,1.55rem);line-height:1.18;color:var(--tone);font-variant-numeric:tabular-nums}
.tile-violet{--tone:var(--violet)}.tile-amber{--tone:var(--amber)}
.tile-teal{--tone:var(--teal)}.tile-red{--tone:var(--red)}
#definition,#backlog-order{color:var(--muted)}
.charts{grid-template-columns:repeat(auto-fit,minmax(min(100%,25rem),1fr));margin-block:1rem}
.charts>div{min-width:0;padding:.85rem;border:1px solid var(--line);border-radius:.65rem;background:var(--subtle)}
.bars>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(2.25rem,1fr) minmax(2ch,auto);gap:.45rem;align-items:center;margin-block:.35rem}
.bars span{overflow-wrap:anywhere}progress{width:100%;accent-color:var(--accent)}#distribution progress{accent-color:var(--teal)}
.tablebox{max-width:100%;overflow:auto;margin:.75rem 0}
table{border-collapse:collapse;width:100%}
td,th{text-align:start;padding:.65rem;border-bottom:1px solid var(--line);vertical-align:top;min-width:6.5rem}
thead th{background:var(--subtle)}
#backlog-body td:nth-child(2),#table-body td:nth-child(2){min-width:14rem;max-width:24rem;overflow-wrap:anywhere}
#sla td{font-variant-numeric:tabular-nums}
#sla td:last-child{font-weight:650}
p{margin:.625rem 0}
dl{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:.35rem 1rem}dt{font-weight:600}dd{margin:0}dt,dd{overflow-wrap:anywhere}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><button id="theme" type="button" aria-pressed="false"></button></header>
  <details><summary id="criteria-title"></summary><dl id="criteria"></dl></details>
  <section>
    <h2 id="filters-title"></h2>
    <div id="filters" class="filters"></div>
  </section>
  <section id="indicators" hidden>
    <h2 id="summary-title"></h2>
    <div id="kpis" class="tiles"></div>
    <p id="definition"></p>
    <div class="charts">
      <div><h3 id="volume-title"></h3><div id="volume" class="bars"></div></div>
      <div><div id="dimension-control"></div><div id="distribution" class="bars"></div></div>
    </div>
    <div id="sla" class="tablebox"></div>
  </section>
  <section>
    <h2 id="backlog-title"></h2>
    <p id="backlog-order"></p>
    <p id="backlog-empty" hidden></p>
    <div id="backlog-table" class="tablebox"><table><thead id="backlog-head"></thead><tbody id="backlog-body"></tbody></table></div>
    <div id="backlog-pagination" class="toolbar" hidden>
      <button id="backlog-previous" type="button"></button><span id="backlog-page" aria-live="polite"></span><button id="backlog-next" type="button"></button>
    </div>
  </section>
  <section>
    <div class="toolbar"><h2 id="tickets-title"></h2><button id="csv" type="button"></button></div>
    <p id="count" aria-live="polite"></p>
    <div class="tablebox"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
    <div class="toolbar"><button id="previous" type="button"></button><span id="page"></span><button id="next" type="button"></button></div>
  </section>
</main>
<script id="report-data" type="application/json">__MANAGERIAL_REPORT_DATA__</script>
<script>
'use strict';
const byId = id => document.getElementById(id);
const { labels: l, rows, columns, locale, criteria, indicators, date_field, group_by, observed_day } = JSON.parse(byId('report-data').textContent);
const node = (tag, value) => {
  const item = document.createElement(tag);
  if (value !== undefined && value !== null) item.textContent = value;
  return item;
};
document.documentElement.lang = locale;
document.title = l.title;
const captions = {
  title: l.title, theme: l.theme, 'criteria-title': l.criteria, 'filters-title': l.interactive_filters, 'summary-title': l.summary,
  definition: l.close_policy, 'volume-title': l.volume, 'tickets-title': l.tickets, csv: l.export_csv, previous: l.previous, next: l.next,
  'backlog-title': l.backlog, 'backlog-order': l.backlog_order, 'backlog-empty': l.empty,
  'backlog-previous': l.previous, 'backlog-next': l.next,
};
Object.entries(captions).forEach(([id, title]) => { byId(id).textContent = title; });
criteria.forEach(([name, value]) => byId('criteria').append(node('dt', name), node('dd', value)));
const number = new Intl.NumberFormat(locale, { maximumFractionDigits: 1 });
const days = new Intl.NumberFormat(locale, { style: 'unit', unit: 'day', unitDisplay: 'long' });
const observed = Date.parse(observed_day + 'T00:00:00Z');
const age = stamp => stamp ? Math.max(0, (observed - Date.parse(stamp.slice(0, 10) + 'T00:00:00Z')) / 86400000) : null;
const dims = ['status','phase','priority','assignee','team','queue','company','establishment','unit','service','category','origin'];
const headings = Object.entries(columns);
const dates = ['opened_at', 'created_at', 'updated_at'];
const fieldViews = {};
const size = 50;
let page = 0;
let filtered = [];
let backlogPage = 0;
let backlog = [];
function labelOf(row, key) {
  if (key === 'origin') return l.origins[row.origin];
  if (key === 'phase') return l.phases[row.phase];
  if (key === 'assignee' && !row.assignee) return l.unassigned;
  if (key === 'first_response_result' || key === 'resolution_result') {
    const kind = key.replace('_result', '');
    return l.results[row.sla[kind]?.result || 'unmeasured'];
  }
  if (key === 'first_response_seconds' || key === 'resolution_seconds') {
    return row.sla[key.replace('_seconds', '')]?.seconds;
  }
  return row[key];
}
function select(label, id, entries, selected, mount) {
  const wrapper = node('label', label);
  const control = node('select');
  control.id = id;
  entries.forEach(([key, name]) => {
    const option = node('option', name);
    option.value = key;
    control.append(option);
  });
  control.value = selected;
  wrapper.append(control);
  mount.append(wrapper);
  return control;
}
function inputDate(label, id) {
  const wrapper = node('label', label);
  const input = node('input');
  input.type = 'date';
  input.id = id;
  input.min = '2026-01-01';
  wrapper.append(input);
  byId('filters').append(wrapper);
  return input;
}
const reference = select(l.date_reference, 'date-reference', dates.map(k => [k, columns[k]]), date_field, byId('filters'));
const from = inputDate(l.from, 'from');
const to = inputDate(l.to, 'to');
const grouping = select(l.group, 'grouping', Object.entries(l.groups), group_by, byId('filters'));
const distribution = select(l.choose_dimension, 'dimension', dims.map(k => [k, columns[k]]), 'origin', byId('dimension-control'));
for (const key of dims) {
  const names = [...new Set(rows.map(row => labelOf(row, key) || l.missing))].sort((a, b) => a.localeCompare(b, locale));
  const entries = [['', l.all], ...names.map(name => [name, name])];
  if (key === 'origin') entries.splice(1, 0, ['@native', l.origins.native]);
  fieldViews[key] = select(columns[key], 'filter-' + key, entries, '', byId('filters'));
}
function matches(row) {
  const day = row[reference.value].slice(0, 10);
  if ((from.value && day < from.value) || (to.value && day > to.value)) return false;
  return dims.every(key => {
    const value = fieldViews[key].value;
    if (key === 'origin' && value === '@native') return ['manual', 'portal'].includes(row.origin);
    return !value || (labelOf(row, key) || l.missing) === value;
  });
}
function meanClockSeconds(facts) {
  // Rails serializes the decimal elapsed_seconds field as a JSON string.
  const seconds = facts.filter(fact => ['within', 'late'].includes(fact.result) &&
    (typeof fact.seconds === 'number' || (typeof fact.seconds === 'string' && fact.seconds.trim() !== '')))
    .map(fact => Number(fact.seconds))
    .filter(value => Number.isFinite(value) && value >= 0);
  return seconds.length ? number.format(seconds.reduce((sum, value) => sum + value, 0) / seconds.length) : l.missing;
}
function closingTime(rowsWithClosure) {
  if (!rowsWithClosure.length) return l.missing;
  const seconds = rowsWithClosure.reduce((sum, row) => sum + row.closure_seconds, 0) / rowsWithClosure.length;
  const minutes = Math.floor(seconds / 60);
  if (!minutes) return seconds ? l.under_one_minute : '0 min';
  return [[Math.floor(minutes / 1440), 'd'], [Math.floor(minutes / 60) % 24, 'h'], [minutes % 60, 'min']]
    .filter(([value]) => value).map(([value, unit]) => number.format(value) + ' ' + unit).join(' ');
}
function countsBy(key) {
  const groups = new Map();
  filtered.forEach(row => { const keyValue = key(row); groups.set(keyValue, (groups.get(keyValue) || 0) + 1); });
  return [...groups];
}
function bucket(row) {
  const day = row[reference.value].slice(0, 10);
  if (grouping.value === 'month') return day.slice(0, 7);
  if (grouping.value === 'year') return day.slice(0, 4);
  if (grouping.value !== 'week') return day;
  const date = new Date(day + 'T00:00:00Z');
  date.setUTCDate(date.getUTCDate() - (date.getUTCDay() + 6) % 7);
  return date.toISOString().slice(0, 10);
}
function tiles(values) {
  const items = values.map(([label, value, tone]) => {
    const tile = node('div');
    tile.className = 'tile tile-' + tone;
    tile.append(node('span', label), node('strong', value));
    return tile;
  });
  byId('kpis').replaceChildren(...items);
}
function bars(id, values) {
  const max = Math.max(1, ...values.map(([, count]) => count));
  const lines = values.map(([name, value]) => {
    const row = node('div');
    const progress = node('progress');
    progress.max = max;
    progress.value = value;
    progress.setAttribute('aria-label', name);
    row.append(node('span', name), progress, node('span', number.format(value)));
    return row;
  });
  byId(id).replaceChildren(...lines);
}
function drawIndicators() {
  if (!indicators) return;
  const counts = Object.fromEntries(countsBy(row => row.phase));
  const newCount = filtered.filter(row => row.phase === 'open' && row.initial).length;
  const closed = filtered.filter(row => row.phase === 'closed' && Number.isFinite(row.closure_seconds) && row.closure_seconds >= 0);
  const phaseTones = { open: 'blue', waiting: 'amber', resolved: 'teal', closed: 'teal', cancelled: 'red' };
  tiles([
    [l.total, number.format(filtered.length), 'blue'],
    ...Object.entries(l.phases).map(([phase, name]) => [name, number.format(counts[phase] || 0), phaseTones[phase]]),
    [l.new_count, number.format(newCount), 'blue'],
    [l.in_service, number.format((counts.open || 0) - newCount), 'violet'],
    [l.open_or_waiting, number.format((counts.open || 0) + (counts.waiting || 0)), 'amber'],
    [l.closure_rate, filtered.length ? number.format((counts.closed || 0) * 100 / filtered.length) : l.missing, 'teal'],
    [l.closure_measured, number.format(closed.length), 'teal'],
    [l.closing_time, closingTime(closed), 'violet'],
  ]);
  bars('volume', countsBy(bucket).sort(([a], [b]) => a.localeCompare(b)).slice(-24));
  const selected = distribution.value;
  const missing = selected === 'assignee' ? l.unassigned : l.missing;
  const ranked = countsBy(row => labelOf(row, selected) || missing).sort((a, b) => b[1] - a[1]);
  const top = ranked.slice(0, 20);
  const missingRow = ranked.find(([label]) => label === missing);
  if (missingRow && !top.includes(missingRow)) top.push(missingRow);
  bars('distribution', top);
  const table = node('table');
  const tableHead = table.createTHead().insertRow();
  ['SLA', ...Object.values(l.sla)].forEach(label => {
    const heading = node('th', label);
    heading.scope = 'col';
    tableHead.append(heading);
  });
  const tableBody = table.createTBody();
  Object.entries(l.clocks).forEach(([kind, name]) => {
    const facts = filtered.map(row => row.sla[kind]).filter(Boolean);
    const result = value => facts.filter(fact => fact.result === value).length;
    const values = [facts.length, filtered.length - facts.length, result('within'), result('late'),
      result('in_progress') + result('overdue'), result('overdue'), meanClockSeconds(facts)];
    const heading = node('th', name);
    heading.scope = 'row';
    tableBody.insertRow().append(heading, ...values.map(value => node('td', typeof value === 'number' ? number.format(value) : value)));
  });
  byId('sla').replaceChildren(table);
}
function drawTable() {
  const body = document.createDocumentFragment();
  filtered.slice(page * size, page * size + size).forEach(row => {
    const line = node('tr');
    headings.forEach(([key]) => line.append(node('td', labelOf(row, key) ?? '—')));
    body.append(line);
  });
  byId('table-body').replaceChildren(body);
  byId('count').textContent = filtered.length ? l.total + ' · ' + number.format(filtered.length) : l.empty;
  byId('page').textContent = (page + 1) + ' / ' + Math.max(1, Math.ceil(filtered.length / size));
  byId('previous').disabled = page <= 0;
  byId('next').disabled = (page + 1) * size >= filtered.length;
}
function drawBacklog() {
  const body = document.createDocumentFragment();
  for (const row of backlog.slice(backlogPage * size, (backlogPage + 1) * size)) {
    const line = node('tr');
    const fields = ['id', 'title', 'company', 'assignee', 'priority', 'status'];
    fields.forEach(key => line.append(node('td', labelOf(row, key) ?? l.missing)));
    for (const stamp of [row.opened_at, row.updated_at]) {
      const value = age(stamp);
      line.append(node('td', Number.isFinite(value) ? days.format(value) : l.missing));
    }
    body.append(line);
  }
  byId('backlog-body').replaceChildren(body);
  byId('backlog-empty').hidden = backlog.length > 0;
  byId('backlog-table').hidden = backlog.length === 0;
  byId('backlog-pagination').hidden = backlog.length <= size;
  byId('backlog-page').textContent = (backlogPage + 1) + ' / ' + Math.ceil(backlog.length / size);
  byId('backlog-previous').disabled = backlogPage <= 0;
  byId('backlog-next').disabled = (backlogPage + 1) * size >= backlog.length;
}
function refresh() {
  filtered = rows.filter(matches);
  page = 0;
  backlogPage = 0;
  backlog = filtered.filter(row => row.phase === 'open' || row.phase === 'waiting')
    .sort((a, b) => age(a.opened_at) - age(b.opened_at) || Number(a.id) - Number(b.id));
  drawIndicators();
  drawTable();
  drawBacklog();
}
function csvCell(value) {
  let text = String(value ?? '').replace(/\0/g, '');
  if (/^[\s]*[=+@-]|^[\t\r\n]/u.test(text)) text = "'" + text;
  return '"' + text.replace(/"/g, '""') + '"';
}
byId('csv').addEventListener('click', () => {
  const lines = [headings.map(([, label]) => csvCell(label)).join(',')];
  filtered.forEach(row => lines.push(headings.map(([key]) => csvCell(labelOf(row, key))).join(',')));
  const url = URL.createObjectURL(new Blob(['\uFEFF', lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' }));
  const link = node('a');
  link.href = url;
  link.download = 'ServiceDesk.csv';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
function dark(value) {
  document.documentElement.classList.toggle('dark', value);
  byId('theme').setAttribute('aria-pressed', String(value));
}
dark(matchMedia('(prefers-color-scheme: dark)').matches);
byId('theme').addEventListener('click', () => dark(!document.documentElement.classList.contains('dark')));
byId('previous').addEventListener('click', () => { page -= 1; drawTable(); });
byId('next').addEventListener('click', () => { page += 1; drawTable(); });
byId('backlog-previous').addEventListener('click', () => { backlogPage -= 1; drawBacklog(); });
byId('backlog-next').addEventListener('click', () => { backlogPage += 1; drawBacklog(); });
byId('filters').addEventListener('change', refresh);
distribution.addEventListener('change', drawIndicators);
const headingsRow = node('tr');
headings.forEach(([, heading]) => headingsRow.append(node('th', heading)));
byId('table-head').append(headingsRow);
const backlogHead = node('tr');
[columns.id, columns.title, columns.company, columns.assignee, columns.priority, columns.status, l.age, l.since_update]
  .forEach(label => backlogHead.append(node('th', label)));
byId('backlog-head').append(backlogHead);
byId('indicators').hidden = !indicators;
refresh();
</script>
</body>
</html>
